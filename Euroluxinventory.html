                a roller-set line running at 1,760 pieces needs a very different trigger point
                from a corner cleat at 18.
              </span>
            </div>
            <div class="row">
              <button class="btn btn-primary" @click="saveSettings()" :disabled="saving">Save settings</button>
              <button class="btn" @click="seedSample()" :disabled="saving">Load sample data</button>
            </div>
          </div>

          <div class="card card-pad stack" style="max-width:660px">
            <h3 style="font-size:.95rem">Database</h3>
            <div class="row" style="justify-content:space-between;font-size:.85rem">
              <span class="muted">Firebase project</span><span class="mono" x-text="projectId"></span>
            </div>
            <div class="row" style="justify-content:space-between;font-size:.85rem">
              <span class="muted">Articles / movements loaded</span>
              <span class="num" x-text="`${inventory.length} / ${movements.length}`"></span>
            </div>
            <div class="row" style="justify-content:space-between;font-size:.85rem">
              <span class="muted">Connection</span>
              <span class="pill" :class="online ? 'pill-good' : 'pill-mute'"
                    x-text="online ? 'online' : 'offline'"></span>
            </div>
            <div class="row" style="justify-content:space-between;font-size:.85rem">
              <span class="muted">Waiting to sync</span>
              <span class="num" x-text="pendingWrites"></span>
            </div>
            <p class="hint">
              Every article, movement and project is stored on this device first, so the app
              works with no connection at all. Changes sync to the other devices by themselves
              whenever there is a network. The ledger table draws 300 rows at a time
              for speed, but every movement is loaded, so project totals are complete.
            </p>
          </div>
        </div>

      </div><!-- /view -->
    </main>
  </div>
  </template>

  <!-- ===================== ITEM MODAL ===================== -->
  <template x-if="itemOpen">
    <div class="backdrop" @click.self="itemOpen=false" @keydown.escape.window="itemOpen=false">
      <div class="modal">
        <div class="modal-head">
          <h3 x-text="itemForm.id ? 'Edit profile' : 'Add profile'"></h3>
          <button class="btn btn-sm btn-ghost" @click="itemOpen=false">Close</button>
        </div>
        <form @submit.prevent="saveItem()">
          <div class="modal-body">
            <div class="grid-2">
              <div class="field">
                <label class="label">Article code *</label>
                <input class="input mono" x-model.trim="itemForm.article_ref" required placeholder="e.g. 391440">
              </div>
              <div class="field">
                <label class="label">Held for</label>
                <select class="select" x-model="itemForm.holding">
                  <option value="Stock">Main stock</option>
                  <template x-for="h in holdings.filter(x => x !== 'Stock')" :key="h">
                    <option :value="h" x-text="h"></option>
                  </template>
                </select>
                <span class="hint">Main stock is free to use. Anything else is bought for that job.</span>
              </div>
              <div class="field">
                <label class="label">System reference</label>
                <select class="select" x-show="!itemSystemNew" :value="itemForm.system_ref"
                        @change="chooseSystem($event.target.value, 'item')">
                  <option value="">&mdash; Choose a system &mdash;</option>
                  <template x-for="s in systemChoices(itemForm.system_ref)" :key="s">
                    <option :value="s" x-text="s"></option>
                  </template>
                  <option value="__new">+ Add a new system&hellip;</option>
                </select>
                <div class="row" x-show="itemSystemNew" style="gap:.4rem">
                  <input class="input" x-model.trim="itemForm.system_ref"
                         placeholder="Name the new system, e.g. FWS 60 CW">
                  <button type="button" class="btn btn-sm"
                          @click="itemSystemNew=false; itemForm.system_ref=''">Cancel</button>
                </div>
              </div>
            </div>
            <div class="field">
              <label class="label">Profile component description *</label>
              <input class="input" x-model.trim="itemForm.description" required
                     placeholder="e.g. INNER PROFILE 69 (319760) ( I )">
            </div>
            <div class="grid-3">
              <div class="field">
                <label class="label">Unit</label>
                <input class="input" x-model.trim="itemForm.unit" placeholder="bars / packets / sets">
              </div>
              <div class="field">
                <label class="label">Location</label>
                <input class="input" x-model.trim="itemForm.location" placeholder="Rack A3">
              </div>
              <div class="field">
                <label class="label">Reorder level</label>
                <input class="input num" type="number" min="0" step="any" x-model.number="itemForm.min_qty">
                <span class="hint" x-text="`0 = use default (${fmt(settings.shortageThreshold)})`"></span>
              </div>
            </div>
            <template x-if="!itemForm.id">
              <div class="field">
                <label class="label">Opening stock received</label>
                <input class="input num" type="number" min="0" step="any" x-model.number="itemForm.received_qty">
                <span class="hint">Recorded as an opening receipt in the ledger.</span>
              </div>
            </template>
            <template x-if="itemForm.id">
              <div class="banner banner-info">
                Received and issued totals change through stock movements, not here — that is what
                keeps the audit trail intact. Use <strong>Receive</strong> / <strong>Issue</strong>
                on the stock table.
              </div>
            </template>
          </div>
          <div class="modal-foot">
            <template x-if="itemForm.id">
              <button type="button" class="btn btn-danger" @click="removeItem()">Delete</button>
            </template>
            <button type="button" class="btn" @click="itemOpen=false">Cancel</button>
            <button type="submit" class="btn btn-primary" :disabled="saving">
              <span x-show="saving" class="spinner"></span><span>Save profile</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- ===================== MOVEMENT MODAL ===================== -->
  <template x-if="moveOpen">
    <div class="backdrop" @click.self="moveOpen=false" @keydown.escape.window="moveOpen=false">
      <div class="modal" style="max-width:520px">
        <div class="modal-head">
          <h3 x-text="moveForm.type==='receive' ? 'Receive stock' : (moveForm.type==='issue' ? 'Issue stock' : 'Adjust stock')"></h3>
          <button class="btn btn-sm btn-ghost" @click="moveOpen=false">Close</button>
        </div>
        <form @submit.prevent="saveMove()">
          <div class="modal-body">
            <div class="card card-pad" style="background:var(--bg-2)">
              <div class="mono" style="color:var(--accent);font-weight:700" x-text="moveForm.article_ref"></div>
              <div class="muted" style="font-size:.85rem" x-text="moveForm.description"></div>
              <div class="row" style="margin-top:.6rem;font-size:.8rem">
                <span class="muted">On hand: <strong class="num" x-text="fmt(moveForm.on_hand)"></strong></span>
              </div>
            </div>

            <div class="field">
              <label class="label">Movement type</label>
              <div class="seg">
                <button type="button" :class="moveForm.type==='receive' && 'on'" @click="moveForm.type='receive'">Receive</button>
                <button type="button" :class="moveForm.type==='issue' && 'on'" @click="moveForm.type='issue'">Issue</button>
                <button type="button" :class="moveForm.type==='adjust' && 'on'" @click="moveForm.type='adjust'">Adjust</button>
              </div>
            </div>

            <div class="field">
              <label class="label">Quantity *</label>
              <input class="input num" type="number" min="0" step="any" x-model.number="moveForm.qty" required placeholder="0">
              <template x-if="moveForm.type==='issue' && moveForm.qty > moveForm.on_hand">
                <span class="hint" style="color:var(--warn)">
                  This issues more than the recorded balance and will leave a negative stock position.
                </span>
              </template>
              <template x-if="moveForm.type==='adjust'">
                <span class="hint">An adjustment corrects the received total — a recount, or damaged bars written back in.</span>
              </template>

            <div class="field" x-show="moveForm.type==='issue'">
              <label class="label">Villa project</label>
              <select class="select" x-model="moveForm.project_id">
                <option value="">— Unallocated —</option>
                <template x-for="p in projects" :key="p.id">
                  <option :value="p.id" x-text="p.project_code"></option>
                </template>
              </select>
            </div>

            <div class="field">
              <label class="label">Note</label>
              <input class="input" x-model.trim="moveForm.note" placeholder="Delivery note no., cutter name, reason…">
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn" @click="moveOpen=false">Cancel</button>
            <button type="submit" class="btn btn-primary" :disabled="saving">
              <span x-show="saving" class="spinner"></span><span>Post movement</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- ===================== PROJECT MODAL ===================== -->
  <template x-if="projectOpen">
    <div class="backdrop" @click.self="projectOpen=false" @keydown.escape.window="projectOpen=false">
      <div class="modal" style="max-width:520px">
        <div class="modal-head">

          <div class="modal-body">
            <div class="field">
              <label class="label">Project code / name *</label>
              <input class="input" x-model.trim="projectForm.project_code" required

            </div>
            <div class="grid-2">
              <div class="field">
                <label class="label">Client</label>

                <label class="label">Status</label>
                <select class="select" x-model="projectForm.status">
                  <option value="active">active</option>
                  <option value="on hold">on hold</option>

              </div>
            </div>
            <div class="field">
              <label class="label">Notes</label>
              <textarea class="textarea" x-model.trim="projectForm.notes"></textarea>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn" @click="projectOpen=false">Cancel</button>
            <button type="submit" class="btn btn-primary" :disabled="saving">
              <span x-show="saving" class="spinner"></span><span>Save project</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- ===================== BOM MODAL ===================== -->
  <template x-if="bomOpen">
    <div class="backdrop" @click.self="bomOpen=false" @keydown.escape.window="bomOpen=false">
      <div class="modal" style="max-width:780px">
        <div class="modal-head">
          <h3 x-text="bomForm.id ? 'Edit BOM template' : 'New BOM template'"></h3>
          <button class="btn btn-sm btn-ghost" @click="bomOpen=false">Close</button>
        </div>
        <form @submit.prevent="saveBom()">
          <div class="modal-body">
            <div class="grid-2">
              <div class="field">
                <label class="label">Template name *</label>
                <input class="input" x-model.trim="bomForm.name" placeholder="e.g. ASE 36 Pocket Sliding Door" required>
              </div>
              <div class="field">
                <label class="label">System reference</label>
                <select class="select" x-show="!bomSystemNew" :value="bomForm.system_ref"
                        @change="chooseSystem($event.target.value, 'bom')">
                  <option value="">&mdash; Choose a system &mdash;</option>
                  <template x-for="s in systemChoices(bomForm.system_ref)" :key="s">
                    <option :value="s" x-text="s"></option>
                  </template>
                  <option value="__new">+ Add a new system&hellip;</option>
                </select>
                <div class="row" x-show="bomSystemNew" style="gap:.4rem">
                  <input class="input" x-model.trim="bomForm.system_ref"
                         placeholder="Name the new system, e.g. FWS 60 CW">
                  <button type="button" class="btn btn-sm"
                          @click="bomSystemNew=false; bomForm.system_ref=''">Cancel</button>
                </div>
              </div>
            </div>

            <template x-if="!bomForm.id && systems.length">
              <div class="banner banner-info">
                <div style="width:100%">
                  <strong>Seed from a system group.</strong>
                  Pulls in every article carrying that system reference at 1 per unit, ready for
                  you to correct — faster than typing a long bundle by hand.
                  <div class="row" style="margin-top:.6rem">
                    <select class="select" style="max-width:240px" x-model="bomSeedSystem">
                      <option value="">— Choose system —</option>
                      <template x-for="s in systems" :key="s">
                        <option :value="s" x-text="s"></option>
                      </template>
                    </select>
                    <button type="button" class="btn btn-sm" @click="seedBomFromSystem()" :disabled="!bomSeedSystem">
                      Seed lines
                    </button>
                  </div>
                </div>
              </div>
            </template>

            <div>
              <div class="row" style="justify-content:space-between;margin-bottom:.5rem">
                <span class="label">Profiles consumed per unit</span>
                <button type="button" class="btn btn-sm" @click="addBomLine()">Add line</button>
              </div>
              <div class="stack" style="gap:.6rem">
                <template x-for="(line,idx) in bomForm.lines" :key="idx">
                  <div class="bom-line">
                    <div class="field">
                      <label class="label">Article</label>
                      <input class="input mono" x-model.trim="line.article_ref" list="article-list"
                             placeholder="Article code" @change="fillLine(line)">
                    </div>
                    <div class="field">
                      <label class="label">Description</label>
                      <input class="input" x-model.trim="line.description" placeholder="Auto-filled from stock list">
                    </div>
                    <div class="field">
                      <label class="label">Qty / unit</label>
                      <input class="input num" type="number" min="0" step="any" x-model.number="line.qty_per">
                    </div>
                    <button type="button" class="btn btn-sm btn-danger" @click="bomForm.lines.splice(idx,1)"
                            aria-label="Remove line">&#10005;</button>
                  </div>
                </template>
                <template x-if="!bomForm.lines.length">
                  <p class="hint">No lines yet — add the profiles this system consumes.</p>
                </template>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn" @click="bomOpen=false">Cancel</button>
            <button type="submit" class="btn btn-primary" :disabled="saving">
              <span x-show="saving" class="spinner"></span><span>Save template</span>
            </button>
          </div>
        </form>
      </div>
    </div>
  </template>

  <!-- ===================== MINIMUM LEVELS MODAL ===================== -->
  <template x-if="levelsOpen">
    <div class="backdrop" @click.self="levelsOpen=false" @keydown.escape.window="levelsOpen=false">
      <div class="modal" style="max-width:560px">
        <div class="modal-head">
          <h3>Set minimum levels</h3>
          <button class="btn btn-sm btn-ghost" @click="levelsOpen=false">Close</button>
        </div>
        <div class="modal-body">
          <div class="banner banner-info">
            <div>
              An article is flagged for replenishment once its balance reaches its minimum.
              Articles with no minimum of their own fall back to the shared default in
              Settings (<span x-text="fmt(settings.shortageThreshold)"></span>).
            </div>
          </div>
          <div class="grid-2">
            <div class="field">
              <label class="label">Apply to</label>
              <select class="select" x-model="levelsForm.system">
                <option value="">Every system</option>
                <template x-for="g in systemSummary" :key="g.name">
                  <option :value="g.name" x-text="g.name"></option>
                </template>
              </select>
            </div>
            <div class="field">
              <label class="label">Minimum level</label>
              <input class="input num" type="number" min="0" step="any" x-model.number="levelsForm.value">
            </div>
          </div>
          <label class="row" style="gap:.5rem;cursor:pointer;margin-top:.2rem">
            <input type="checkbox" x-model="levelsForm.onlyBlank">
            <span>Only articles that have no minimum set yet</span>
          </label>
          <p class="hint" style="margin-top:.6rem"
             x-text="`This will change ${fmt(levelsTargets.length)} article(s).`"></p>
        </div>
        <div class="modal-foot">
          <button class="btn" @click="levelsOpen=false">Cancel</button>
          <button class="btn btn-primary" @click="applyLevels()" :disabled="saving || !levelsTargets.length">
            <span x-show="saving" class="spinner"></span><span>Apply</span>
          </button>
        </div>
      </div>

  <!-- ===================== BOOK TO JOB MODAL ===================== -->
  <template x-if="bookOpen">
    <div class="backdrop" @click.self="bookOpen=false" @keydown.escape.window="bookOpen=false">
      <div class="modal" style="max-width:920px">
        <div class="modal-head">
          <h3>Book stock to a job</h3>
          <button class="btn btn-sm btn-ghost" @click="bookOpen=false">Close</button>
        </div>
        <div class="modal-body">
          <div class="grid-2">
            <div class="field">
              <label class="label">Job / villa project *</label>
              <select id="book-project" class="select" x-show="!bookNewProject" x-model="book.projectId"
                      @change="book.projectId==='__new' && (bookNewProject=true, book.projectId='')">
                <option value="">&mdash; Choose a job &mdash;</option>
                <template x-for="p in projects" :key="p.id">
                  <option :value="p.id" x-text="p.project_code"></option>
                </template>
                <option value="__new">+ Create a new job&hellip;</option>
              </select>
              <div class="row" x-show="bookNewProject" style="gap:.4rem">
                <input class="input" x-model.trim="book.newProject" placeholder="e.g. Villa 58 - Rasha">
                <button type="button" class="btn btn-sm"
                        @click="bookNewProject=false; book.newProject=''">Cancel</button>
              </div>
            </div>
            <div class="field">
              <label class="label">Draw from *</label>
              <select id="book-holding" class="select" x-model="book.holding" @change="book.picked={}">
                <option value="Stock">Main stock</option>
                <template x-for="h in holdings.filter(x => x !== 'Stock')" :key="h">
                  <option :value="h" x-text="'Allocated to ' + h"></option>
                </template>
              </select>
            </div>
          </div>
          <div class="grid-2">
            <div class="field">
              <label class="label">System *</label>
              <select id="book-system" class="select" x-model="book.system" @change="book.picked={}">
                <option value="">&mdash; Choose a system &mdash;</option>
                <template x-for="sy in bookSystems" :key="sy">
                  <option :value="sy" x-text="sy"></option>
                </template>
              </select>
            </div>
            <div></div>
          </div>

          <template x-if="!book.system">
            <p class="hint">Choose a system and its articles appear below, with what is on hand.</p>
          </template>

          <template x-if="book.system">
            <div class="stack" style="gap:.6rem">
              <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:.5rem">
                <input class="input" style="max-width:280px" x-model.trim="bookSearch"
                       placeholder="Filter by code or description">
                <div class="row" style="gap:.5rem">
                  <span class="faint" style="font-size:.8rem"
                        x-text="`${fmt(bookLines.length)} line(s) entered`"></span>
                  <button type="button" class="btn btn-sm btn-ghost" @click="book.picked={}"
                          :disabled="!bookLines.length">Clear</button>
                </div>
              </div>

              <div class="table-wrap" style="max-height:46vh;overflow:auto">
                <table>
                  <thead><tr>
                    <th>Article</th><th>Description</th><th>Unit</th>
                    <th class="right">On hand</th><th class="right">Minimum</th><th class="right">Book qty</th>
                  </tr></thead>
                  <tbody>
                    <template x-for="i in bookCandidates" :key="i.id">
                      <tr :class="bookOver(i) && 'row-bad'">
                        <td class="mono" style="color:var(--accent);font-weight:700" x-text="i.article_ref"></td>
                        <td class="truncate" style="max-width:260px" x-text="i.description"></td>
                        <td class="faint" x-text="i.unit || '—'"></td>
                        <td class="right num" style="font-weight:700"
                            :style="balanceOf(i) <= 0 ? 'color:var(--bad);font-weight:700' : 'font-weight:700'"
                            x-text="fmt(balanceOf(i))"></td>
                        <td class="right num muted" x-text="fmt(reorderLevel(i))"></td>
                        <td class="right">
                          <input class="input num" type="number" min="0" step="any"
                                 style="max-width:110px;margin-left:auto"
                                 :value="book.picked[i.id] || ''"
                                 @input="setBookQty(i.id, $event.target.value)"
                                 placeholder="0">
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <template x-if="bookShortages.length">
                <div class="banner banner-warn">
                  <div>
                    <strong>More than is on hand.</strong>
                    <span x-text="`${fmt(bookShortages.length)} line(s) would take the balance below zero: ` +
                                  bookShortages.slice(0,4).map(l => l.article_ref).join(', ') +
                                  (bookShortages.length > 4 ? '…' : '') + '.'"></span>
                    You can still post it &mdash; the ledger records what really happened &mdash; but those
                    articles will show as negative until the delivery is booked in.
                  </div>
                </div>
              </template>

              <div class="field">
                <label class="label">Note (optional)</label>
                <input class="input" x-model.trim="book.note"
                       placeholder="e.g. cutting list 12-09, cutter Rafiq">
              </div>
            </div>
          </template>
        </div>
        <div class="modal-foot">
          <div class="grow faint" style="font-size:.8rem"
               x-text="bookLines.length ? `${fmt(bookTotalQty)} in ${fmt(bookLines.length)} line(s)` : ''"></div>
          <button class="btn" @click="bookOpen=false">Cancel</button>
          <button class="btn btn-primary" @click="postBooking()"
                  :disabled="issuing || !bookLines.length || (!book.projectId && !book.newProject)">
            <span x-show="issuing" class="spinner"></span><span>Book to job</span>
          </button>
        </div>
      </div>
    </div>
  </template>

  <!-- ===================== IMPORT MODAL ===================== -->
  <template x-if="importOpen">
    <div class="backdrop" @click.self="importOpen=false" @keydown.escape.window="importOpen=false">
      <div class="modal" style="max-width:660px">
        <div class="modal-head">
          <h3>Import data (CSV)</h3>
          <button class="btn btn-sm btn-ghost" @click="importOpen=false">Close</button>
        </div>
        <div class="modal-body">
          <div class="banner banner-info">
            <div>
              A header row is required. The header decides what gets imported:
              <ul style="margin:.5rem 0 .2rem 1.1rem;padding:0">
                <li><strong>Stock list</strong> &mdash;
                  <span class="mono" style="font-size:.76rem">article_ref, description, system_ref, unit, location, min_qty, received_qty, issued_qty</span>.
                  Existing article codes are updated, new ones created.</li>
                <li><strong>Projects</strong> &mdash;
                  <span class="mono" style="font-size:.76rem">project_code, client, status, notes</span>
                  (no article_ref column).</li>
                <li><strong>Movements</strong> &mdash;
                  <span class="mono" style="font-size:.76rem">type, article_ref, qty, project_code, note, import_tag</span>.
                  Each row becomes a permanent ledger entry and moves the balance.
                  Missing projects are created. Articles not already in the stock
                  list are skipped, so import the stock list first.</li>
              </ul>
              Loading a fresh database: stock list, then projects, then movements.
            </div>
          </div>
          <div class="field">
            <label class="label">Paste CSV, or choose a file</label>
            <textarea class="textarea" style="min-height:160px;font-family:var(--mono);font-size:.8rem"
                      x-model="importText"
                      placeholder="article_ref,description,system_ref,unit,min_qty&#10;391440,INNER PROFILE 69 (319760) ( I ),ADS / AWS 65,BAR,0"></textarea>
          </div>
          <input type="file" accept=".csv,text/csv" class="input" @change="readCsvFile($event)">
        </div>
        <div class="modal-foot">
          <button class="btn" @click="importOpen=false">Cancel</button>
          <button class="btn btn-primary" @click="runImport()" :disabled="saving || !importText.trim()">
            <span x-show="saving" class="spinner"></span><span>Import</span>
          </button>
        </div>
      </div>
    </div>
  </template>

/* Minimal RFC-4180-ish CSV parser (handles quotes and embedded commas). */
function parseCsv(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((c) => String(c).trim() !== ""));
}

function toCsv(rows) {
  return rows.map((r) =>
    r.map((cell) => {
      const s = cell === null || cell === undefined ? "" : String(cell);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(",")
  ).join("\n");
}

function downloadCsv(rows, filename) {
  const blob = new Blob(["﻿" + toCsv(rows)], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ---------------------------------------------------------------------------
   MTO / "Material analysis" reader
   ---------------------------------------------------------------------------
   Schuco Logikal exports a project's whole material take-off as one sheet,
   split into sections (Profiles, Hardware, Accessories, Gaskets) with a header
   row each. Two quantities sit on every line:

     Quantity  - purchase units: whole BARS for profiles, packs for the rest
     Required  - net consumption: metres for profiles and gaskets, pieces for
                 hardware and accessories

   Stock is counted in bars for profiles and in pieces/metres/pairs for
   everything else, so the default deduction is Quantity for profiles and
   Required for every other section. Each line stays editable before posting.
--------------------------------------------------------------------------- */
const MTO_SECTIONS = ["profiles", "profile", "hardware", "accessories", "articles",
                      "gaskets", "gasket", "glass", "fillings"];

let _xlsxPromise = null;
function loadSheetReader() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (!_xlsxPromise) {
    _xlsxPromise = new Promise((resolve, reject) => {
      const tag = document.createElement("script");
      tag.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.mini.min.js";
      tag.onload = () => resolve(window.XLSX);
      tag.onerror = () => reject(new Error(
        "Could not load the spreadsheet reader. It needs a connection the first " +
        "time; after that it is cached on this device."));
      document.head.appendChild(tag);
    });
  }
  return _xlsxPromise;
}

/* How a newly created article should be counted in stock, given its MTO line. */
function mtoStockUnit(line) {
  if (line.basis === "bars") return "BAR";
  const u = String(line.unit || "").trim().toLowerCase();
  if (u === "pc" || u === "pcs" || u === "piece") return "NO";
  if (u === "pair" || u === "pairs") return "PAIR";
  if (u === "m") return "M";
  return line.unit || "NO";
}

function parseMto(aoa) {
  const norm = (v) => String(v ?? "").trim();
  const low  = (v) => norm(v).toLowerCase();
  const tight = (v) => low(v).replace(/\s+/g, "");

  /* Column positions are re-read at every header row: the Profiles section
     carries a "Bar" column that the others do not, which shifts nothing we
     use, but a future export might. */
  const headerCols = (row) => {
    const m = {};
    (row || []).forEach((cell, i) => {
      const t = tight(cell);
      if (t === "quantity" && m.qty === undefined) m.qty = i;
      else if (t === "pu" && m.pu === undefined) m.pu = i;
      else if (t === "required" && m.req === undefined) m.req = i;
      else if (t === "unit" && m.unit === undefined) m.unit = i;
      else if (t === "articlenumber" && m.art === undefined) m.art = i;
      else if (t === "description" && m.desc === undefined) m.desc = i;
    });
    return m.art !== undefined ? m : null;
  };

  let project = "", dated = "";
  const lines = [];
  let cols = null, section = "";

  for (let r = 0; r < aoa.length; r++) {
    const row = aoa[r] || [];
    const filled = row.map(norm).filter(Boolean);

    /* Project name and date sit above the first header row. */
    if (!cols) {
      for (const t of filled) {
        if (!dated && /^\d{1,2}[./-]\d{1,2}[./-]\d{2,4}/.test(t)) { dated = t; continue; }
        if (!project && t.length > 6 && low(t) !== "material analysis" && !/^\d/.test(t)) project = t;
      }
    }

    /* A lone section name on its own row switches section. */
    if (filled.length === 1 && MTO_SECTIONS.includes(low(filled[0]))) {
      section = filled[0]; continue;
    }
    const head = headerCols(row);
    if (head) { cols = head; continue; }
    if (!cols) continue;

    const article = norm(row[cols.art]);
    if (!article) continue;                       // Sum rows carry no article

    /* Data rows repeat their section in a column left of Quantity. */
    let sec = section;
    for (let i = 0; i < (cols.qty ?? 2); i++) {
      if (MTO_SECTIONS.includes(low(row[i]))) { sec = norm(row[i]); break; }
    }

    const qty = num(row[cols.qty]);
    const req = num(cols.req !== undefined ? row[cols.req] : 0);
    const isProfile = /^profile/.test(low(sec));
    lines.push({
      sec: sec || "(no section)",
      art: article,
      desc: norm(cols.desc !== undefined ? row[cols.desc] : "") || article,
      unit: norm(cols.unit !== undefined ? row[cols.unit] : ""),
      pu: num(cols.pu !== undefined ? row[cols.pu] : 0),
      qty, req,
      deduct: isProfile ? qty : req,
      basis: isProfile ? "bars" : "required",
    });
  }
  return { project, dated, lines };
}

    /* ---------------- computed ---------------- */
    get displayName() {

      return this.overrideName ||

    /* --- holdings ---------------------------------------------------------
       Stock lives in two kinds of place, exactly as the master workbook keeps

    holdingOf(item) { return (item && item.holding) || "Stock"; },
    get holdings() {
      const set = new Set(this.inventory.map((i) => this.holdingOf(i)));
      set.add("Stock");
      return ["Stock", ...[...set].filter((h) => h !== "Stock")
        .sort((a, b) => String(a).localeCompare(String(b)))];

    get holdingInventory() {

    get systems() {

    },
    /* Everything offered when you TYPE a system reference: the systems above
       plus the ones listed in firebase-config.js, so a new BOM template can

    get systemOptions() {

      const everywhere = [...new Set(this.inventory.map((i) => i.system_ref).filter(Boolean))];

        const k = key(s);
        if (!s || seen.has(k)) continue;
        seen.add(k); out.push(s);
      }
      return out.sort((a, b) => String(a).localeCompare(String(b)));

    get filteredInventory() {
      const q = key(this.searchQuery);
      let list = this.holdingInventory;
      if (this.selectedCategory !== "ALL SYSTEMS") {

    get filteredMovements() {

      return this.movements.filter((m) => {

        if (!q) return true;

    get visibleMovements() { return this.filteredMovements.slice(0, this.ledgerShown); },

    systemChoices(current) {

    chooseSystem(value, which) {

    get totals() { return this.sumOf(this.holdingInventory); },
    get filteredTotals() { return this.sumOf(this.filteredInventory); },
    get systemSummary() {
      const map = new Map();
      for (const i of this.holdingInventory) {
        const name = i.system_ref || "(no system)";
        if (!map.has(name)) map.set(name, { name, count: 0, received: 0, issued: 0, balance: 0, short: 0 });
        const s = map.get(name);
        s.count++;
        s.received += num(i.received_qty);
        s.issued += num(i.issued_qty);
        s.balance += this.balanceOf(i);
        if (this.isShort(i)) s.short++;
      }
      return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
    },
    get shortageItems() {
      return this.holdingInventory
        .filter((i) => this.isShort(i))
        .sort((a, b) =>
          (this.reorderLevel(b) - this.balanceOf(b)) - (this.reorderLevel(a) - this.balanceOf(a)));
    },
    get shortageCount() { return this.shortageItems.length; },
    get negativeCount() { return this.holdingInventory.filter((i) => this.balanceOf(i) < 0).length; },

    systemItems(name) {

    exportStockReport() {
      const rows = [["holding", "system_ref", "article_ref", "description", "unit", "location",

          rows.push([this.holdingOf(i), g.name, i.article_ref, i.description, i.unit || "", i.location || "",
