    get totals() { return this.sumOf(this.inventory); },
    get filteredTotals() { return this.sumOf(this.filteredInventory); },
    get systemSummary() {
      const map = new Map();
      for (const i of this.inventory) {
        const name = i.system_ref || "(no system)";
        if (!map.has(name)) map.set(name, { name, count: 0, received: 0, issued: 0, balance: 0, short: 0 });
        const s = map.get(name);
        s.count++;
        s.received += num(i.received_qty);
        s.issued += num(i.issued_qty);
        s.balance += this.balanceOf(i);
        if (this.isShort(i)) s.short++;
      }
      return [...map.values()].sort((a, b) => a.name.localeCompare(b.name));
    },
    get shortageItems() {
      return this.inventory
        .filter((i) => this.isShort(i))
        .sort((a, b) =>
          (this.reorderLevel(b) - this.balanceOf(b)) - (this.reorderLevel(a) - this.balanceOf(a)));
    },
    get shortageCount() { return this.shortageItems.length; },
    /* How many writes are still sitting on this device, unsent. */
    get pendingWrites() {
      return Object.values(this._pending).reduce((a, b) => a + (b || 0), 0);
    },
    get syncLabel() {
      const n = this.pendingWrites;
      if (!this.online) return n ? n + " WAITING TO SYNC" : "OFFLINE \u2014 SAVED HERE";
      return n ? "SYNCING " + n + "\u2026" : "SYNCED";
    },
    get syncClass() {
      if (this.pendingWrites) return "pill-warn";
      return this.online ? "pill-good" : "pill-mute";
    },
    get selectedBom() { return this.boms.find((b) => b.id === this.wizard.bomId) || null; },
    get wizardLines() {
      const bom = this.selectedBom;
      if (!bom) return [];
      const units = Math.max(0, num(this.wizard.units));
      return (bom.lines || []).map((l) => {
        const item = this.inventory.find((i) => key(i.article_ref) === key(l.article_ref));
        const required = num(l.qty_per) * units;
        const on_hand = item ? this.balanceOf(item) : 0;
        return {
          article_ref: l.article_ref,
          description: (item && item.description) || l.description || "—",
          system_ref: (item && item.system_ref) || bom.system_ref || "",
          qty_per: num(l.qty_per),
          required, on_hand,
          short: Math.max(0, required - on_hand),
          known: !!item,
          item_id: item ? item.id : null,
        };
      });
    },
    get wizardShortage() { return this.wizardLines.some((l) => l.short > 0 || !l.known); },

    /* ---------------- lifecycle ---------------- */
    async initApp() {
      const boot = document.getElementById("boot");
      if (boot) boot.remove();
      document.getElementById("app").style.display = "";

      addEventListener("online", () => { this.online = true; });
      addEventListener("offline", () => { this.online = false; });

      // Work saved on this device but not yet sent. Closing the app is safe —
      // Firestore keeps it and sends it next time — but clearing site data or
      // uninstalling would lose it, so it is worth a warning.
      addEventListener("beforeunload", (e) => {
        if (this.pendingWrites > 0) { e.preventDefault(); e.returnValue = ""; }
      });

      const hash = location.hash.replace("#", "");
      if (this.tabs.some((t) => t.id === hash)) this.currentTab = hash;

      this.registerSw();

      if (this.configMissing) { this.authReady = true; return; }

      onAuthStateChanged(auth, (user) => {
        this.authUser = user;
        this.authReady = true;
        if (user) this.subscribe(user);
        else this.unsubscribeAll();
      });
    },

    registerSw() {
      if (!("serviceWorker" in navigator)) return;
      if (location.protocol === "file:") return;
      navigator.serviceWorker.register("sw.js")
        .catch((e) => console.warn("Service worker registration failed:", e));
    },

    _unsubs: [],
    unsubscribeAll() {
      this._unsubs.forEach((fn) => { try { fn(); } catch (e) {} });
      this._unsubs = [];
      this.inventory = []; this.movements = []; this.projects = []; this.boms = [];
    },

    subscribe(user) {
      this.unsubscribeAll();

      setDoc(doc(db, collections.users, user.uid), {
        email: user.email,
        name: user.displayName || user.email,
        lastSeen: serverTimestamp(),
      }, { merge: true }).catch((e) => console.warn("Could not write user profile:", e));

      const bind = (label, target, ref) => {
        this._unsubs.push(onSnapshot(ref, { includeMetadataChanges: true },
          (snap) => {
            this[target] = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
            // Rows Firestore is still holding locally, waiting for the server.
            this._pending[target] = snap.docs.filter((d) => d.metadata.hasPendingWrites).length;
          },
          (err) => {
            console.error(label + " listener error:", err);
            this.toast(
              err.code === "permission-denied"
                ? "No permission to read " + label + ". Publish the rules from firestore.rules."
                : "Sync error on " + label + ": " + err.message, "err");
          }));
      };

      bind("inventory", "inventory", collection(db, collections.inventory));
      bind("projects", "projects", collection(db, collections.projects));
      bind("BOM templates", "boms", collection(db, collections.boms));
      /* The whole ledger, newest first. Villa Project totals are summed from
         these rows, so a window would silently under-report every project.
         Firestore keeps its own local copy, so this is one download, not one
         per visit; the ledger TABLE is capped separately (LEDGER_PAGE). */
      bind("movements", "movements",
        query(collection(db, collections.movements), orderBy("at", "desc")));

      this._unsubs.push(onSnapshot(doc(db, collections.settings, "imports"),
        (snap) => { this.importsDone = (snap && snap.data && snap.data()) || {}; },
        (e) => console.warn("imports listener:", e)));

      this._unsubs.push(onSnapshot(doc(db, collections.settings, "app"),
        (snap) => {
          const d = snap.data();
          if (d && Number.isFinite(Number(d.shortageThreshold))) {
            this.settings.shortageThreshold = Number(d.shortageThreshold);
          }
        },
        (e) => console.warn("settings listener:", e)));
    },

    /* ---------------- auth ---------------- */
    async submitAuth() {
      this.authError = ""; this.authBusy = true;
      const email = this.authEmail.trim();
      try {
        if (allowedEmailDomain &&
            !email.toLowerCase().endsWith("@" + String(allowedEmailDomain).toLowerCase())) {
          throw { code: "custom", message: "Only @" + allowedEmailDomain + " email addresses are allowed." };
        }
        if (this.authMode === "signup") {
          const cred = await createUserWithEmailAndPassword(auth, email, this.authPassword);
          const name = this.authName.trim();
          if (name) {
            await updateProfile(cred.user, { displayName: name });
            this.overrideName = name;
            // The listener already ran without the name; refresh the profile doc.
            setDoc(doc(db, collections.users, cred.user.uid),
                   { name, email, lastSeen: serverTimestamp() }, { merge: true })
              .catch((err) => console.warn("Could not update profile name:", err));
          }
          this.toast("Account created — welcome.", "ok");
        } else {
          await signInWithEmailAndPassword(auth, email, this.authPassword);
        }
        this.authPassword = "";
      } catch (e) {
        this.authError = e.code === "custom" ? e.message : friendlyAuthError(e.code, e.message);
      } finally {
        this.authBusy = false;
      }
    },

    /* Firebase sends the email and hosts the reset page; there is nothing for
       the app to build beyond asking for the address. */
    async resetPassword() {
      this.authError = ""; this.authNotice = "";
      const email = this.authEmail.trim();
      if (!email) {
        this.authError = "Enter your email address above first, then press this again.";
        return;
      }
      this.authBusy = true;
      try {
        await sendPasswordResetEmail(auth, email);
        // Deliberately the same message whether or not the account exists, so
        // this form cannot be used to discover who has an account.
        this.authNotice =
          "If there is an account for " + email + ", a reset link is on its way. " +
          "Check the inbox, and the spam folder.";
      } catch (e) {
        const code = e.code || "";
        this.authError =
          code === "auth/invalid-email" ? "That email address doesn't look right."
          : code === "auth/too-many-requests" ? "Too many attempts. Wait a minute and try again."
          : code === "auth/network-request-failed" ? "No connection. Check your internet and try again."
          : friendlyAuthError(e.message);
      } finally {
        this.authBusy = false;
      }
    },

    async doSignOut() {
      if (!confirm("Sign out of Eurolux Inventory?")) return;
      this.unsubscribeAll();
      await signOut(auth);
      this.overrideName = "";
      this.menuOpen = false;
    },

    /* ---------------- ui helpers ---------------- */
    go(tab) {
      this.currentTab = tab;
      this.menuOpen = false;
      history.replaceState(null, "", "#" + tab);
    },
    fmt(v) { return nf.format(num(v)); },
    balanceOf(item) { return num(item.received_qty) - num(item.issued_qty); },
    reorderLevel(item) {
      const own = num(item.min_qty);
      return own > 0 ? own : num(this.settings.shortageThreshold);
    },
    isShort(item) { return this.balanceOf(item) <= this.reorderLevel(item); },
    statusLabel(item) {
      const bal = this.balanceOf(item);
      if (bal < 0) return "negative";
      if (bal === 0) return "out of stock";
      return bal <= this.reorderLevel(item) ? "low" : "in stock";
    },
    statusClass(item) {
      const bal = this.balanceOf(item);
      if (bal <= 0) return "pill-bad";
      return bal <= this.reorderLevel(item) ? "pill-warn" : "pill-good";
    },
    moveClass(type) {
      return type === "receive" ? "pill-good" : type === "issue" ? "pill-info" : "pill-mute";
    },
    sumOf(list) {
      let received = 0, issued = 0;
      for (const i of list) { received += num(i.received_qty); issued += num(i.issued_qty); }
      return { received, issued, balance: received - issued };
    },
    when(ts) {
      if (!ts) return "—";
      const d = ts.toDate ? ts.toDate() : new Date(ts);
      if (Number.isNaN(d.getTime())) return "—";
      return d.toLocaleString("en-GB", {
        day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit",
      });
    },
    toast(text, kind = "info") {
      const id = Date.now() + Math.random();
      this.toasts.push({ id, text, kind });
      setTimeout(() => { this.toasts = this.toasts.filter((t) => t.id !== id); }, 5000);
    },

    /* Firestore writes are deliberately NOT awaited.
       The local database is updated straight away and the listeners fire, but
       the returned promise only settles once the SERVER has acknowledged the
       write — which, offline, is never. Awaiting it would leave the storekeeper
       staring at a spinner after a movement that has in fact been saved, and
       they would post it a second time. So: fire the write, update the UI from
       the local snapshot, and report failures through this handler. */
    track(promise, what) {
      promise.catch((e) => {
        console.error("Write failed (" + what + "):", e);
        this.toast(
          e.code === "permission-denied"
            ? "Permission denied saving " + what + ". Check your Firestore rules."
            : "Could not save " + what + ": " + e.message, "err");
      });
      return promise;
    },
    /* Wording for a write that has been saved locally but not yet sent. */
    savedMsg(text) {
      return this.online
        ? text
        : text + " Saved on this device \u2014 it will sync when you are back online.";
    },

    /* Aggregated per-article booking lines for one project. */
    projectLines(pid) {
      const map = new Map();
      for (const m of this.movements) {
        if (m.project_id !== pid || m.type !== "issue") continue;
        const k = key(m.article_ref);
        if (!map.has(k)) {
          map.set(k, {
            article_ref: m.article_ref,
            description: m.description || "",
            system_ref: m.system_ref || "",
            qty: 0, count: 0, last: null,
          });
        }
        const line = map.get(k);
        line.qty += num(m.qty);
        line.count++;
        const t = m.at && m.at.toDate ? m.at.toDate() : (m.at ? new Date(m.at) : null);
        if (t && (!line.last || t > line.last)) line.last = t;
      }
      return [...map.values()].sort((a, b) =>
        String(a.article_ref).localeCompare(String(b.article_ref), undefined, { numeric: true }));
    },
    projectTotal(pid) {
      return this.projectLines(pid).reduce((s, l) => s + l.qty, 0);
    },

    /* ---------------- settings ---------------- */
    saveSettings() {
      this.track(setDoc(doc(db, collections.settings, "app"), {
        shortageThreshold: num(this.settings.shortageThreshold),
        updatedAt: serverTimestamp(),
        updatedBy: this.displayName,
      }, { merge: true }), "settings");
      this.toast(this.savedMsg("Settings saved for all users."), "ok");
    },

    /* ---------------- sample data ---------------- */
    async seedSample() {
      if (this.inventory.length &&
          !confirm("Your stock list is not empty. Add the 8 sample articles anyway?")) return;
      this.saving = true;
      try {
        const batch = writeBatch(db);
        let added = 0;
        for (const row of SAMPLE_INVENTORY) {
          if (this.inventory.some((i) => key(i.article_ref) === key(row.article_ref))) continue;
          batch.set(doc(collection(db, collections.inventory)), {
            system_ref: row.system_ref,
            article_ref: row.article_ref,
            description: row.description,
            unit: row.unit || "",
            location: "",
            min_qty: num(row.min_qty),
            received_qty: num(row.received_qty),
            issued_qty: num(row.issued_qty),
            balance_stock_qty: num(row.received_qty) - num(row.issued_qty),
            createdAt: serverTimestamp(), createdBy: this.displayName,
          });
          added++;
        }
        for (const p of SAMPLE_PROJECTS) {
          if (this.projects.some((x) => key(x.project_code) === key(p.project_code))) continue;
          batch.set(doc(collection(db, collections.projects)), {
            ...p, createdAt: serverTimestamp(), createdBy: this.displayName,
          });
        }
        this.track(batch.commit(), "sample data");
        this.toast("Sample data loaded — " + added + " articles.", "ok");
      } catch (e) {
        this.toast("Could not load sample data: " + e.message, "err");
      } finally { this.saving = false; }
    },

    /* ---------------- inventory CRUD ---------------- */
    openItem(item = null) {
      this.itemForm = item
        ? { ...item }
        : { article_ref: "", system_ref: "", description: "", unit: "bars",
            location: "", min_qty: 0, received_qty: 0 };
      this.itemSystemNew = false;
      this.itemOpen = true;
    },

    async saveItem() {
      if (this.saving) return;
      const f = this.itemForm;
      if (!f.article_ref || !f.description) return;

      const dup = this.inventory.find(
        (i) => key(i.article_ref) === key(f.article_ref) && i.id !== f.id);
      if (dup) { this.toast("Article " + f.article_ref + " already exists in the stock list.", "err"); return; }

      this.saving = true;
      try {
        const base = {
          article_ref: String(f.article_ref),
          system_ref: f.system_ref || "",
          description: f.description,
          unit: f.unit || "",
          location: f.location || "",
          min_qty: num(f.min_qty),
          updatedAt: serverTimestamp(),
          updatedBy: this.displayName,
        };

        if (f.id) {
          this.track(updateDoc(doc(db, collections.inventory, f.id), base), "the profile");
          this.toast(this.savedMsg("Profile updated."), "ok");
        } else {
          const opening = num(f.received_qty);
          // The id is generated locally, so this works with no network at all.
          const ref = doc(collection(db, collections.inventory));
          const batch = writeBatch(db);
          batch.set(ref, {
            ...base,
            received_qty: opening,
            issued_qty: 0,
            balance_stock_qty: opening,
            createdAt: serverTimestamp(),
            createdBy: this.displayName,
          });
          if (opening > 0) {
            batch.set(doc(collection(db, collections.movements)), {
              item_id: ref.id, article_ref: base.article_ref, description: base.description,
              system_ref: base.system_ref, type: "receive", qty: opening,
              project_id: "", project_code: "", note: "Opening stock",
              at: serverTimestamp(), by: this.authUser.uid, by_name: this.displayName,
            });
          }
          this.track(batch.commit(), "the profile");
          this.toast(this.savedMsg("Profile " + base.article_ref + " added."), "ok");
        }
        this.itemOpen = false;
      } catch (e) {
        this.toast("Could not save: " + e.message, "err");
      } finally { this.saving = false; }
    },

    async removeItem() {
      const f = this.itemForm;
      if (!f.id) return;
      if (!confirm("Delete " + f.article_ref + " from the stock list?\n\nMovement history is kept for audit.")) return;
      this.track(deleteDoc(doc(db, collections.inventory, f.id)), "the deletion");
      this.itemOpen = false;
      this.toast(this.savedMsg("Profile deleted."), "ok");
    },

    /* ---------------- movements ---------------- */
    openMove(item, type) {
      this.moveForm = {
        item_id: item.id,
        article_ref: item.article_ref,
        description: item.description,
        system_ref: item.system_ref || "",
        on_hand: this.balanceOf(item),
        type, qty: null, project_id: "", note: "",
      };
      this.moveOpen = true;
    },

    async saveMove() {
      if (this.saving) return;
      const f = this.moveForm;
      const qty = num(f.qty);
      if (qty <= 0) { this.toast("Enter a quantity greater than zero.", "err"); return; }

      this.saving = true;
      try {
        const project = this.projects.find((p) => p.id === f.project_id);
        const batch = writeBatch(db);

        // Atomic increments: two storekeepers posting at the same moment both count.
        batch.update(doc(db, collections.inventory, f.item_id),
          f.type === "issue"
            ? { issued_qty: increment(qty), balance_stock_qty: increment(-qty),
                updatedAt: serverTimestamp(), updatedBy: this.displayName }
            : { received_qty: increment(qty), balance_stock_qty: increment(qty),
                updatedAt: serverTimestamp(), updatedBy: this.displayName });

        batch.set(doc(collection(db, collections.movements)), {
          item_id: f.item_id, article_ref: f.article_ref, description: f.description,
          system_ref: f.system_ref || "", type: f.type, qty,
          project_id: f.project_id || "", project_code: (project && project.project_code) || "",
          note: f.note || "", at: serverTimestamp(),
          by: this.authUser.uid, by_name: this.displayName,
        });

        this.track(batch.commit(), "the movement");
        this.moveOpen = false;
        this.toast(this.savedMsg(
          this.fmt(qty) + (f.type === "issue" ? " issued from " : " received into ") +
          f.article_ref + "."), "ok");
      } catch (e) {
        this.toast("Could not post movement: " + e.message, "err");
      } finally { this.saving = false; }
    },

    /* ---------------- projects ---------------- */
    openProject(p = null) {
      this.projectForm = p
        ? { ...p }
        : { project_code: "", client: "", status: "active", notes: "" };
      this.projectOpen = true;
    },
    async saveProject() {
      if (this.saving) return;
      const f = this.projectForm;
      if (!f.project_code) return;
      this.saving = true;
      try {
        const data = {
          project_code: f.project_code, client: f.client || "",
          status: f.status || "active", notes: f.notes || "",
          updatedAt: serverTimestamp(), updatedBy: this.displayName,
        };
        this.track(
          f.id
            ? updateDoc(doc(db, collections.projects, f.id), data)
            : setDoc(doc(collection(db, collections.projects)),
                     { ...data, createdAt: serverTimestamp() }),
          "the project");
        this.projectOpen = false;
        this.toast(this.savedMsg("Project saved."), "ok");
      } catch (e) {
        this.toast("Could not save project: " + e.message, "err");
      } finally { this.saving = false; }
    },
    async removeProject(p) {
      if (!confirm('Delete project "' + p.project_code + '"?\n\nMaterial already booked to it stays in the ledger.')) return;
      this.track(deleteDoc(doc(db, collections.projects, p.id)), "the deletion");
      if (this.wizard.projectId === p.id) this.wizard.projectId = "";
      this.toast(this.savedMsg("Project deleted."), "ok");
    },

    /* ---------------- BOM templates ---------------- */
    openBom(b = null) {
      this.bomSeedSystem = "";
      this.bomForm = b
        ? { ...b, lines: (b.lines || []).map((l) => ({ ...l })) }
        : { name: "", system_ref: "", lines: [{ article_ref: "", description: "", qty_per: 1 }] };
      this.bomSystemNew = false;
      this.bomOpen = true;
    },
    addBomLine() { this.bomForm.lines.push({ article_ref: "", description: "", qty_per: 1 }); },
    fillLine(line) {
      const item = this.inventory.find((i) => key(i.article_ref) === key(line.article_ref));
      if (item && !line.description) line.description = item.description;
    },
    seedBomFromSystem() {
      const sys = this.bomSeedSystem;
      if (!sys) return;
      const lines = this.inventory
        .filter((i) => i.system_ref === sys)
        .sort((a, b) => String(a.article_ref).localeCompare(String(b.article_ref), undefined, { numeric: true }))
        .map((i) => ({ article_ref: i.article_ref, description: i.description, qty_per: 1 }));
      if (!lines.length) { this.toast("No articles carry that system reference.", "err"); return; }
      this.bomForm.lines = lines;
      if (!this.bomForm.system_ref) this.bomForm.system_ref = sys;
      if (!this.bomForm.name) this.bomForm.name = sys;
      this.toast(lines.length + " lines seeded at 1 per unit — correct the quantities before saving.", "info");
    },
    async saveBom() {
      if (this.saving) return;
      const f = this.bomForm;
      if (!f.name) return;
      const lines = (f.lines || [])
        .filter((l) => String(l.article_ref || "").trim())
        .map((l) => ({
          article_ref: String(l.article_ref).trim(),
          description: l.description || "",
          qty_per: num(l.qty_per),
        }));
      if (!lines.length) { this.toast("Add at least one profile line.", "err"); return; }

      const zero = lines.filter((l) => l.qty_per <= 0);
      if (zero.length && !confirm(
        zero.length + " line(s) have a quantity of zero and will never be issued. Save anyway?")) return;

      this.saving = true;
      try {
        const data = {
          name: f.name, system_ref: f.system_ref || "", lines,
          updatedAt: serverTimestamp(), updatedBy: this.displayName,
        };
        if (f.id) {
          this.track(updateDoc(doc(db, collections.boms, f.id), data), "the template");
        } else {
          const ref = doc(collection(db, collections.boms));
          this.track(setDoc(ref, { ...data, createdAt: serverTimestamp() }), "the template");
          this.wizard.bomId = ref.id;
        }
        this.bomOpen = false;
        this.toast(this.savedMsg("BOM template saved."), "ok");
      } catch (e) {
        this.toast("Could not save template: " + e.message, "err");
      } finally { this.saving = false; }
    },
    async removeBom(b) {
      if (!confirm('Delete BOM template "' + b.name + '"?')) return;
      this.track(deleteDoc(doc(db, collections.boms, b.id)), "the deletion");
      if (this.wizard.bomId === b.id) this.wizard.bomId = "";
      this.toast(this.savedMsg("Template deleted."), "ok");
    },

    /* ---------------- batch booking ---------------- */
    async issueBundle() {
      const project = this.projects.find((p) => p.id === this.wizard.projectId);
      if (!project) { this.toast("Select a project destination first.", "err"); return; }

      const lines = this.wizardLines.filter((l) => l.required > 0);
      if (!lines.length) { this.toast("Nothing to book — check the unit count.", "err"); return; }

      const unknown = lines.filter((l) => !l.known);
      const issuable = lines.filter((l) => l.known);
      if (!issuable.length) { this.toast("None of these articles are in the stock list.", "err"); return; }

      const shortLines = issuable.filter((l) => l.short > 0);
      const msg =
        "Book " + this.wizard.units + " × " + this.selectedBom.name +
        " to " + project.project_code + "?\n\n" +
        issuable.length + " profile line(s) will be issued." +
        (unknown.length
          ? "\n\n" + unknown.length + " article(s) are not in the stock list and will be skipped:\n" +
            unknown.map((l) => l.article_ref).join(", ")
          : "") +
        (shortLines.length
          ? "\n\n⚠ " + shortLines.length + " line(s) exceed available stock and will go negative."
          : "");
      if (!confirm(msg)) return;

      this.issuing = true;
      try {
        const batch = writeBatch(db);
        for (const l of issuable) {
          batch.update(doc(db, collections.inventory, l.item_id), {
            issued_qty: increment(l.required),
            balance_stock_qty: increment(-l.required),
            updatedAt: serverTimestamp(),
            updatedBy: this.displayName,
          });
          batch.set(doc(collection(db, collections.movements)), {
            item_id: l.item_id, article_ref: l.article_ref, description: l.description,
            system_ref: l.system_ref || "", type: "issue", qty: l.required,
            project_id: project.id, project_code: project.project_code,
            note: "BOM: " + this.selectedBom.name + " × " + this.wizard.units,
            at: serverTimestamp(), by: this.authUser.uid, by_name: this.displayName,
          });
        }
        this.track(batch.commit(), "the bundle");
        this.toast(this.savedMsg("Package bundle booked to " + project.project_code +
                   " — " + issuable.length + " lines posted."), "ok");
        this.go("projects");
      } catch (e) {
        this.toast("Could not book bundle: " + e.message, "err");
      } finally { this.issuing = false; }
    },

    /* ---------------- CSV ---------------- */
    exportCsv() {
      const header = ["system_ref", "article_ref", "description", "unit", "location",
                      "min_qty", "received_qty", "issued_qty", "balance_stock_qty"];
      const rows = [header].concat(this.filteredInventory.map((i) => [
        i.system_ref || "", i.article_ref, i.description, i.unit || "", i.location || "",
        num(i.min_qty), num(i.received_qty), num(i.issued_qty), this.balanceOf(i),
      ]));
      downloadCsv(rows, "eurolux-stock-" + new Date().toISOString().slice(0, 10) + ".csv");
    },

    exportProjectCsv() {
      const header = ["project_code", "article_ref", "description", "system_ref", "qty_booked", "bookings"];
      const rows = [header];
      for (const p of this.projects) {
        for (const l of this.projectLines(p.id)) {
          rows.push([p.project_code, l.article_ref, l.description, l.system_ref, l.qty, l.count]);
        }
      }
      if (rows.length === 1) { this.toast("No bookings to export yet.", "err"); return; }
      downloadCsv(rows, "eurolux-project-bookings-" + new Date().toISOString().slice(0, 10) + ".csv");
    },

    readCsvFile(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { this.importText = String(reader.result || ""); };
      reader.onerror = () => this.toast("Could not read that file.", "err");
      reader.readAsText(file);
    },

    /* ------------------------------------------------------------------
       Import. One entry point, three kinds of file, chosen by the header:
         has "type" + "qty"                -> movement ledger rows
         has "project_code", no "article_ref" -> villa projects
         otherwise                          -> the stock list
       Recommended order for a fresh database: stock, projects, movements.
    ------------------------------------------------------------------ */
    importKind(header) {
      const has = (...names) =>
        names.some((n) => header.indexOf(n.replace(/[\s_-]+/g, "").toLowerCase()) >= 0);
      if (has("type") && has("qty", "quantity")) return "movements";
      if (has("project_code", "project") && !has("article_ref", "articleref", "article", "code"))
        return "projects";
      return "inventory";
    },

    async runImport() {
      if (this.saving) return;
      const rows = parseCsv(this.importText.trim());
      if (rows.length < 2) { this.toast("Need a header row plus at least one data row.", "err"); return; }

      // Accept snake_case, camelCase or spaced headers.
      const header = rows[0].map((h) => String(h).trim().replace(/[\s_-]+/g, "").toLowerCase());
      const col = (...names) => {
        for (const n of names) {
          const idx = header.indexOf(n.replace(/[\s_-]+/g, "").toLowerCase());
          if (idx >= 0) return idx;
        }
        return -1;
      };

      const kind = this.importKind(header);
      this.saving = true;
      try {
        if (kind === "movements")    await this.importMovements(rows, col);
        else if (kind === "projects") await this.importProjects(rows, col);
        else                          await this.importInventory(rows, col);
      } catch (e) {
        this.toast("Import failed: " + e.message, "err");
      } finally { this.saving = false; }
    },

    /* ---- the stock list ------------------------------------------------ */
    async importInventory(rows, col) {
      const cArticle = col("article_ref", "articleref", "article", "code");
      if (cArticle < 0) { this.toast('CSV must contain an "article_ref" column.', "err"); return; }
      const cDesc = col("description", "desc", "material_description"),
            cSys  = col("system_ref", "system"),
            cUnit = col("unit"), cLoc = col("location"),
            cMin  = col("min_qty", "reorder", "reorder_level"),
            cRec  = col("received_qty", "received"),
            cIss  = col("issued_qty", "issued");

      let created = 0, updated = 0, skipped = 0;
      const seen = new Set();
      const data = [];
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const article_ref = String(r[cArticle] ?? "").trim();
        if (!article_ref) { skipped++; continue; }
        if (seen.has(key(article_ref))) { skipped++; continue; } // duplicate within the file
        seen.add(key(article_ref));
        data.push({ r, article_ref });
      }

      for (let i = 0; i < data.length; i += 200) {
        const batch = writeBatch(db);
        for (const entry of data.slice(i, i + 200)) {
          const r = entry.r, article_ref = entry.article_ref;
          const existing = this.inventory.find((x) => key(x.article_ref) === key(article_ref));

          const fields = {
            article_ref,
            description: cDesc >= 0 ? String(r[cDesc] ?? "").trim() : ((existing && existing.description) || article_ref),
            system_ref: cSys >= 0 ? String(r[cSys] ?? "").trim() : ((existing && existing.system_ref) || ""),
            unit: cUnit >= 0 ? String(r[cUnit] ?? "").trim() : ((existing && existing.unit) || ""),
            location: cLoc >= 0 ? String(r[cLoc] ?? "").trim() : ((existing && existing.location) || ""),
            min_qty: cMin >= 0 ? num(r[cMin]) : num(existing && existing.min_qty),
            updatedAt: serverTimestamp(),
            updatedBy: this.displayName,
          };
          const received = cRec >= 0 ? num(r[cRec]) : num(existing && existing.received_qty);
          const issued   = cIss >= 0 ? num(r[cIss]) : num(existing && existing.issued_qty);
          if (cRec >= 0) fields.received_qty = received;
          if (cIss >= 0) fields.issued_qty = issued;
          if (cRec >= 0 || cIss >= 0) fields.balance_stock_qty = received - issued;

          if (existing) {
            batch.update(doc(db, collections.inventory, existing.id), fields);
            updated++;
          } else {
            batch.set(doc(collection(db, collections.inventory)), {
              received_qty: 0, issued_qty: 0, balance_stock_qty: 0, ...fields,
              createdAt: serverTimestamp(), createdBy: this.displayName,
            });
            created++;
          }
        }
        this.track(batch.commit(), "the import");
      }
      this.importOpen = false;
      this.importText = "";
      this.toast(this.savedMsg("Stock list imported — " + created + " created, " +
                 updated + " updated" +
                 (skipped ? ", " + skipped + " skipped" : "") + "."), "ok");
    },

    /* ---- villa projects ------------------------------------------------ */
    async importProjects(rows, col) {
      const cCode = col("project_code", "project");
      if (cCode < 0) { this.toast('CSV must contain a "project_code" column.', "err"); return; }
      const cClient = col("client"), cStatus = col("status"), cNotes = col("notes", "note");

      let created = 0, updated = 0, skipped = 0;
      const batch = writeBatch(db);
      const seen = new Set();
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const code = String(r[cCode] ?? "").trim();
        if (!code || seen.has(key(code))) { skipped++; continue; }
        seen.add(key(code));
        const existing = this.projects.find((p) => key(p.project_code) === key(code));
        const fields = {
          project_code: code,
          client: cClient >= 0 ? String(r[cClient] ?? "").trim() : ((existing && existing.client) || ""),
          status: cStatus >= 0 ? (String(r[cStatus] ?? "").trim() || "active") : ((existing && existing.status) || "active"),
          notes: cNotes >= 0 ? String(r[cNotes] ?? "").trim() : ((existing && existing.notes) || ""),
          updatedAt: serverTimestamp(), updatedBy: this.displayName,
        };
        if (existing) { batch.update(doc(db, collections.projects, existing.id), fields); updated++; }
        else {
          batch.set(doc(collection(db, collections.projects)),
            { ...fields, createdAt: serverTimestamp(), createdBy: this.displayName });
          created++;
        }
      }
      this.track(batch.commit(), "the projects");
      this.importOpen = false;
      this.importText = "";
      this.toast(this.savedMsg("Projects imported — " + created + " created, " +
                 updated + " updated" + (skipped ? ", " + skipped + " skipped" : "") + "."), "ok");
    },

    /* ---- movement ledger ----------------------------------------------
       Every row becomes a permanent ledger entry AND moves the article's
       running totals, so balances stay derived from real movements rather
       than typed in. Projects named in the file are created if missing.
       An "import_tag" column makes the file self-identifying, so posting
       the same file twice asks for confirmation first.
    -------------------------------------------------------------------- */
    async importMovements(rows, col) {
      const cType = col("type"), cArt = col("article_ref", "articleref", "article", "code"),
            cQty  = col("qty", "quantity"), cProj = col("project_code", "project"),
            cNote = col("note", "notes"), cTag = col("import_tag", "tag");
      if (cArt < 0) { this.toast('CSV must contain an "article_ref" column.', "err"); return; }

      const tag = cTag >= 0 ? String(rows[1][cTag] ?? "").trim() : "";
      if (tag && this.importsDone[tag]) {
        const when = String(this.importsDone[tag]).slice(0, 10);
        if (!confirm('"' + tag + '" was already imported on ' + when +
                     ".\n\nPosting it again will DOUBLE every quantity in it.\n\nImport anyway?")) return;
      }

      const byArticle = new Map();
      for (const i of this.inventory) byArticle.set(key(i.article_ref), i);

      // Pass 1: parse, and work out which projects we are missing.
      const parsed = [];
      let skipped = 0, unknown = new Set();
      const wantProjects = new Map();
      for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        const article_ref = String(r[cArt] ?? "").trim();
        const qty = num(cQty >= 0 ? r[cQty] : 0);
        let type = (cType >= 0 ? String(r[cType] ?? "") : "").trim().toLowerCase();
        if (type === "receipt" || type === "received" || type === "in") type = "receive";
        if (type === "issued" || type === "out") type = "issue";
        if (!["receive", "issue", "adjust"].includes(type)) type = "receive";
        if (!article_ref || !(qty > 0)) { skipped++; continue; }
        const item = byArticle.get(key(article_ref));
        if (!item) { skipped++; unknown.add(article_ref); continue; }
        const code = cProj >= 0 ? String(r[cProj] ?? "").trim() : "";
        if (code) wantProjects.set(key(code), code);
        parsed.push({ item, type, qty, code,
                      note: cNote >= 0 ? String(r[cNote] ?? "").trim() : "" });
      }
      if (!parsed.length) {
        this.toast("Nothing to post — " + (unknown.size
          ? unknown.size + " article code(s) in the file are not in the stock list. Import the stock list first."
          : "no usable rows."), "err");
        return;
      }

      if (!confirm("Post " + parsed.length + " movements to the ledger?\n\n" +
                   "This writes permanent audit entries and moves every balance. " +
                   "It cannot be undone from inside the app.")) return;

      // Pass 2: create any missing projects, keeping their new ids to hand.
      const projMap = new Map();
      for (const p of this.projects) projMap.set(key(p.project_code), { id: p.id, project_code: p.project_code });
      let newProjects = 0;
      const pre = writeBatch(db);
      for (const [k, code] of wantProjects) {
        if (projMap.has(k)) continue;
        const ref = doc(collection(db, collections.projects));
        pre.set(ref, { project_code: code, client: "", status: "active",
                       notes: "Created by import", createdAt: serverTimestamp(),
                       createdBy: this.displayName });
        projMap.set(k, { id: ref.id, project_code: code });
        newProjects++;
      }
      if (newProjects) this.track(pre.commit(), "the projects");

      // Pass 3: post the ledger in chunks, folding each article's moves into
      // a single atomic increment per chunk.
      for (let i = 0; i < parsed.length; i += 200) {
        const chunk = parsed.slice(i, i + 200);
        const batch = writeBatch(db);
        const delta = new Map();
        for (const m of chunk) {
          const project = m.code ? projMap.get(key(m.code)) : null;
          batch.set(doc(collection(db, collections.movements)), {
            item_id: m.item.id, article_ref: m.item.article_ref,
            description: m.item.description || "", system_ref: m.item.system_ref || "",
            type: m.type, qty: m.qty,
            project_id: (project && project.id) || "",
            project_code: (project && project.project_code) || "",
            note: m.note, at: serverTimestamp(),
            by: this.authUser.uid, by_name: this.displayName,
          });
          const d = delta.get(m.item.id) || { rec: 0, iss: 0 };
          if (m.type === "issue") d.iss += m.qty; else d.rec += m.qty;
          delta.set(m.item.id, d);
        }
        for (const [id, d] of delta) {
          batch.update(doc(db, collections.inventory, id), {
            received_qty: increment(d.rec),
            issued_qty: increment(d.iss),
            balance_stock_qty: increment(d.rec - d.iss),
            updatedAt: serverTimestamp(), updatedBy: this.displayName,
          });
        }
        this.track(batch.commit(), "the movements");
      }

      if (tag) {
        this.track(setDoc(doc(db, collections.settings, "imports"),
          { [tag]: new Date().toISOString() }, { merge: true }), "the import record");
      }

      this.importOpen = false;
      this.importText = "";
      this.toast(this.savedMsg("Ledger imported — " + parsed.length + " movements posted" +
                 (newProjects ? ", " + newProjects + " projects created" : "") +
                 (skipped ? ", " + skipped + " rows skipped" : "") + "."), "ok");
      if (unknown.size) {
        this.toast(unknown.size + " article code(s) were not in the stock list and were skipped: " +
                   [...unknown].slice(0, 5).join(", ") + (unknown.size > 5 ? "…" : ""), "err");
      }
    },
  }));
