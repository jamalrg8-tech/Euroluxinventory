<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Eurolux Inventory &amp; Stock Control</title>
<meta name="description" content="Aluminium profile inventory, BOM allocation and stock control for Eurolux fabrication.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0284c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eurolux">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* ===========================================================================
   Design tokens
   =========================================================================== */
:root{
  --bg:#0f172a; --bg-2:#0b1220; --panel:#111c30; --panel-2:#16233b;
  --line:#1e2f4a; --line-soft:#1a2942;
  --text:#e8eef7; --muted:#93a4bd; --faint:#64748b;
  --accent:#38bdf8; --accent-solid:#0284c7; --accent-dim:rgba(56,189,248,.12);
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --violet:#a78bfa;
  --radius:14px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
[x-cloak]{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#274060;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#33547c}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}

/* ===========================================================================
   Primitives
   =========================================================================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.6rem 1rem;border-radius:var(--radius-sm);font-size:.875rem;font-weight:600;
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  transition:background .15s,border-color .15s,opacity .15s;white-space:nowrap;
}
.btn:hover{background:#1c2c48;border-color:#2b4368}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:var(--panel-2);border-color:var(--line)}
.btn-primary{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff}
.btn-primary:hover{background:#0369a1;border-color:#0369a1}
.btn-primary:disabled:hover{background:var(--accent-solid);border-color:var(--accent-solid)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--panel-2);color:var(--text);border-color:transparent}
.btn-danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.35);color:#fca5a5}
.btn-danger:hover{background:rgba(248,113,113,.2);border-color:rgba(248,113,113,.5)}
.btn-sm{padding:.35rem .6rem;font-size:.78rem;border-radius:8px}
.btn-block{width:100%}

.field{display:flex;flex-direction:column;gap:.35rem;min-width:0}
.label{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.input,.select,.textarea{
  width:100%;background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:.6rem .75rem;font-size:.9rem;
  transition:border-color .15s,box-shadow .15s;
}
.input:focus,.select:focus,.textarea:focus{
  outline:none;border-color:var(--accent-solid);box-shadow:0 0 0 3px var(--accent-dim);
}
.input::placeholder{color:var(--faint)}
.select{appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='none' stroke='%2393a4bd' stroke-width='1.6' d='M1 1.5l5 5 5-5'/></svg>");
  background-repeat:no-repeat;background-position:right .7rem center;padding-right:2rem}
.textarea{resize:vertical;min-height:72px}
.hint{font-size:.75rem;color:var(--faint)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.card-pad{padding:1.1rem 1.25rem}

.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .55rem;border-radius:999px;
  font-size:.7rem;font-weight:700;letter-spacing:.03em;border:1px solid transparent;white-space:nowrap}
.pill-good{background:rgba(52,211,153,.12);color:var(--good);border-color:rgba(52,211,153,.25)}
.pill-warn{background:rgba(251,191,36,.12);color:var(--warn);border-color:rgba(251,191,36,.28)}
.pill-bad{background:rgba(248,113,113,.12);color:var(--bad);border-color:rgba(248,113,113,.28)}
.pill-info{background:var(--accent-dim);color:var(--accent);border-color:rgba(56,189,248,.25)}
.pill-mute{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.dot{width:7px;height:7px;border-radius:999px;background:currentColor;flex:none}

.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.right{text-align:right}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===========================================================================
   Shell
   =========================================================================== */
.shell{display:flex;height:100dvh;overflow:hidden}
.sidebar{
  width:264px;flex:none;background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:space-between;
  padding-bottom:env(safe-area-inset-bottom);
}
.brand{display:flex;align-items:center;gap:.7rem;padding:1rem 1.1rem;border-bottom:1px solid var(--line)}
.brand-mark{
  background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff;font-weight:800;
  font-size:.7rem;letter-spacing:.12em;padding:.5rem .55rem;border-radius:10px;flex:none
}
.brand-name{font-size:.8rem;font-weight:700;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:.62rem;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;font-weight:600}
.nav{padding:.75rem;display:flex;flex-direction:column;gap:.15rem}
.nav-item{
  display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;
  padding:.65rem .8rem;border-radius:var(--radius-sm);font-size:.875rem;font-weight:550;
  color:var(--muted);transition:background .15s,color .15s
}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);box-shadow:inset 2px 0 0 var(--accent-solid)}
.nav-item .ico{width:18px;height:18px;flex:none}
.nav-badge{margin-left:auto;font-size:.68rem;font-weight:700;padding:.05rem .4rem;border-radius:999px;
  background:rgba(248,113,113,.15);color:var(--bad)}
.side-foot{padding:.9rem 1rem;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.6rem}
.who{display:flex;align-items:center;gap:.6rem;min-width:0}
.avatar{width:30px;height:30px;border-radius:999px;background:var(--accent-solid);color:#fff;
  display:grid;place-items:center;font-size:.72rem;font-weight:700;flex:none}

.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{
  height:60px;flex:none;border-bottom:1px solid var(--line);background:rgba(11,18,32,.6);
  backdrop-filter:blur(8px);display:flex;align-items:center;gap:.75rem;padding:0 1.25rem
}
.search{position:relative;flex:1;max-width:460px}
.search .input{padding-left:2.2rem}
.search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--faint)}
.view{flex:1;overflow-y:auto;padding:1.5rem;-webkit-overflow-scrolling:touch}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.1rem;flex-wrap:wrap}
.view-title{font-size:1.15rem;font-weight:700}
.view-sub{font-size:.82rem;color:var(--muted);margin-top:.15rem}
.actions{display:flex;gap:.5rem;flex-wrap:wrap}
.menu-btn{display:none}

/* ===========================================================================
   Data display
   =========================================================================== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem}
.kpi-label{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi-value{font-size:1.9rem;font-weight:700;margin-top:.4rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi-foot{font-size:.74rem;color:var(--faint);margin-top:.3rem}

.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead th{
  position:sticky;top:0;z-index:1;background:var(--panel-2);color:var(--muted);
  font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:.7rem .7rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap
}
tbody td{padding:.7rem .7rem;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(56,189,248,.04)}
tbody tr.row-bad{background:rgba(248,113,113,.05)}
tbody tr.row-link{cursor:pointer}
tbody tr.row-link:hover{background:rgba(56,189,248,.08)}
tbody tr.row-link:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.group-head{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;background:none;border:0;
  color:inherit;font:inherit;padding:.75rem .9rem;cursor:pointer;border-bottom:1px solid var(--line)}
.group-head:hover{background:var(--panel-2)}
.group-head .caret{transition:transform .15s ease;flex:none;color:var(--muted)}
.group-head.open .caret{transform:rotate(90deg)}
.group-head .grow{flex:1;min-width:0}
.modal-foot .grow{flex:1;min-width:0;text-align:left}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--muted);font:inherit;font-size:.82rem;font-weight:600;
  padding:.5rem .9rem;cursor:pointer}
.seg button.on{background:var(--accent);color:#04121f}
tfoot td{padding:.7rem .7rem;border-top:1px solid var(--line);background:var(--panel-2);font-weight:700}
.cell-actions{display:flex;gap:.3rem;justify-content:flex-end}

.empty{padding:3rem 1.5rem;text-align:center;color:var(--faint)}
.empty-title{color:var(--muted);font-weight:600;margin-bottom:.3rem}

/* ===========================================================================
   Modals / toasts / auth
   =========================================================================== */
.backdrop{
  position:fixed;inset:0;z-index:60;background:rgba(6,11,22,.72);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:1rem
}
.modal{
  width:100%;max-width:640px;max-height:88dvh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:1rem 1.25rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.modal-body{padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
.modal-foot{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:.6rem;
  position:sticky;bottom:0;background:var(--panel)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}

.toasts{position:fixed;z-index:80;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;max-width:min(92vw,380px)}
.toast{background:var(--panel-2);border:1px solid var(--line);border-left-width:3px;border-radius:var(--radius-sm);
  padding:.7rem .9rem;font-size:.85rem;box-shadow:var(--shadow)}
.toast.ok{border-left-color:var(--good)}
.toast.err{border-left-color:var(--bad)}
.toast.info{border-left-color:var(--accent)}

.auth-screen{min-height:100dvh;display:grid;place-items:center;padding:1.25rem;
  background:radial-gradient(1000px 600px at 50% -10%,rgba(2,132,199,.18),transparent 60%),var(--bg)}
.auth-card{width:100%;max-width:410px}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin-bottom:1.5rem;text-align:center}
.seg{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:3px;gap:3px}
.seg button{flex:1;padding:.45rem;border-radius:8px;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel-2);color:var(--text)}
.linkish{background:none;border:none;color:var(--accent);font-size:.82rem;
  text-decoration:underline;text-underline-offset:3px;padding:.2rem;align-self:center}
.linkish:hover{color:var(--text)}
.linkish:disabled{opacity:.5;cursor:not-allowed}

.banner{display:flex;gap:.7rem;align-items:flex-start;padding:.8rem .95rem;border-radius:var(--radius-sm);
  font-size:.83rem;border:1px solid;line-height:1.5}
.banner-warn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);color:#fcd34d}
.banner-bad{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3);color:#fca5a5}
.banner-info{background:var(--accent-dim);border-color:rgba(56,189,248,.28);color:#7dd3fc}

.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;
  border-radius:999px;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.boot{min-height:100dvh;display:grid;place-items:center;color:var(--muted);gap:.8rem;padding:1.5rem}

.bom-line{display:grid;grid-template-columns:1.1fr 1.6fr .6fr auto;gap:.6rem;align-items:end}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}

/* Stock cards — the phone view of the master stock table. */
.stock-cards{display:none}
.stock-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem}
.stock-card.short{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.04)}
.stock-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem}
.stock-figs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.75rem 0;
  padding:.6rem 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.stock-fig-label{font-size:.6rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.stock-fig-value{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:700;margin-top:.1rem}

/* ===========================================================================
   Responsive
   =========================================================================== */
@media (max-width:900px){
  .grid-3{grid-template-columns:1fr 1fr}
  .bom-line{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .sidebar{
    position:fixed;inset:0 auto 0 0;z-index:70;transform:translateX(-100%);
    transition:transform .22s ease;box-shadow:var(--shadow)
  }
  .sidebar.open{transform:none}
  .menu-btn{display:inline-flex}
  .view{padding:1rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom))}
  .topbar{padding:0 .85rem;gap:.5rem}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .kpi-value{font-size:1.6rem}
  .toasts{left:1rem;right:1rem;max-width:none}
  .scrim{position:fixed;inset:0;z-index:65;background:rgba(6,11,22,.6)}
  /* Master stock becomes cards — no horizontal scrolling on the shop floor. */
  .stock-table{display:none}
  .stock-cards{display:flex;flex-direction:column;gap:.75rem}
  /* Give the search box the room instead of spelling out "shortages". */
  .pill-word{display:none}
}
</style>
</head>

<body>

<!-- =========================================================================
     BOOT GUARD
     ========================================================================= -->
<div id="boot" class="boot">
  <div class="spinner" style="border-top-color:var(--accent)"></div>
  <div id="boot-msg">Starting Eurolux Inventory…</div>
</div>
<script>
  // If the app has not booted within 12s the CDN scripts were almost certainly
  // blocked or unreachable. Say so rather than spinning forever.
  setTimeout(function () {
    var msg = document.getElementById("boot-msg");
    if (!msg) return;
    msg.innerHTML =
      '<div style="max-width:430px;text-align:center;line-height:1.55">' +
      "<strong>The app could not start.</strong><br>" +
      "The Alpine.js or Firebase scripts were blocked. Check your internet " +
      "connection and reload. On a corporate network, allow " +
      '<span style="font-family:monospace">cdn.jsdelivr.net</span> and ' +
      '<span style="font-family:monospace">www.gstatic.com</span>.</div>';
  }, 12000);
</script>

<div id="app" x-data="euroluxApp" x-init="initApp()" x-cloak style="display:none">

  <!-- ===================== CONFIG NOT SET ===================== -->
  <template x-if="configMissing">
    <div class="auth-screen">
      <div class="auth-card card card-pad stack">
        <h2 class="view-title">Firebase is not configured yet</h2>
        <p class="muted" style="font-size:.88rem">
          Open <span class="mono">firebase-config.js</span> in your repository and replace the
          placeholder values with the config object from your Firebase project
          (Project settings → General → Your apps → Web app → Config).
        </p>
        <div class="banner banner-info">Full setup steps are in <span class="mono">README.md</span>.</div>
      </div>
    </div>
  </template>

  <!-- ===================== SIGN IN ===================== -->
  <template x-if="!configMissing && !authUser && authReady">
    <div class="auth-screen">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="brand-mark" style="font-size:.85rem;padding:.7rem .8rem">EUROLUX</div>
          <div>
            <div style="font-weight:700;font-size:1.05rem">Inventory &amp; Stock Control</div>
            <div class="faint" style="font-size:.78rem">Aluminium profile operations</div>
          </div>
        </div>

        <div class="card card-pad stack">
          <template x-if="selfSignupEnabled">
            <div class="seg">
              <button :class="authMode==='signin' && 'on'"
                      @click="authMode='signin';authError='';authNotice=''">Sign in</button>
              <button :class="authMode==='signup' && 'on'"
                      @click="authMode='signup';authError='';authNotice=''">Create account</button>
            </div>
          </template>

          <form @submit.prevent="submitAuth()" class="stack">
            <div class="field" x-show="authMode==='signup'">
              <label class="label">Full name</label>
              <input class="input" type="text" x-model="authName" placeholder="e.g. Steve Mathew" autocomplete="name">
            </div>
            <div class="field">
              <label class="label">Work email</label>
              <input class="input" type="email" x-model="authEmail" required placeholder="you@eurolux.ae" autocomplete="username">
            </div>
            <div class="field">
              <label class="label">Password</label>
              <input class="input" type="password" x-model="authPassword" required minlength="6"
                     placeholder="At least 6 characters" :autocomplete="authMode==='signup'?'new-password':'current-password'">
            </div>

            <template x-if="authNotice">
              <div class="banner banner-info" x-text="authNotice"></div>
            </template>
            <template x-if="authError">
              <div class="banner banner-bad" x-text="authError"></div>
            </template>

            <button class="btn btn-primary btn-block" type="submit" :disabled="authBusy">
              <span x-show="authBusy" class="spinner"></span>
              <span x-text="authMode==='signin' ? 'Sign in' : 'Create account'"></span>
            </button>

            <button type="button" class="linkish" x-show="authMode==='signin'"
                    @click="resetPassword()" :disabled="authBusy">
              Forgot your password?
            </button>
          </form>

          <p class="hint" x-show="!selfSignupEnabled">
            Accounts are created by your administrator. If you do not have one yet,
            ask them to add you.
          </p>
          <p class="hint">
            Everyone who signs in shares the same live database. A receipt or issue
            posted on one device appears on every other device within a second.
          </p>
        </div>
      </div>
    </div>
  </template>

  <!-- ===================== MAIN APP ===================== -->
  <template x-if="!configMissing && authUser">
  <div class="shell">

    <div class="scrim" x-show="menuOpen" @click="menuOpen=false" x-cloak></div>
    <aside class="sidebar" :class="menuOpen && 'open'">
      <div>
        <div class="brand">
          <div class="brand-mark">EUROLUX</div>
          <div style="min-width:0">
            <div class="brand-name">Inventory Control</div>
            <div class="brand-sub">Stock &amp; BOM</div>
          </div>
        </div>

        <nav class="nav">
          <template x-for="t in tabs" :key="t.id">
            <button class="nav-item" :class="currentTab===t.id && 'active'" @click="go(t.id)">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round" x-html="t.icon"></svg>
              <span x-text="t.label"></span>
              <template x-if="t.id==='inventory' && shortageCount>0">
                <span class="nav-badge" x-text="shortageCount"></span>
              </template>
            </button>
          </template>
        </nav>
      </div>

      <div class="side-foot">
        <div class="row" style="justify-content:space-between;font-size:.74rem">
          <span class="muted">Saved on device</span>
          <span class="pill" :class="syncClass">
            <span class="dot"></span>
            <span x-text="syncLabel"></span>
          </span>
        </div>
        <div class="who">
          <div class="avatar" x-text="initials"></div>
          <div style="min-width:0">
            <div class="truncate" style="font-size:.8rem;font-weight:600" x-text="displayName"></div>
            <div class="truncate faint" style="font-size:.7rem" x-text="authUser?.email"></div>
          </div>
        </div>
        <button class="btn btn-sm btn-ghost" @click="doSignOut()">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="btn btn-sm btn-ghost menu-btn" @click="menuOpen=!menuOpen" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>

        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input class="input" type="search" x-model="searchQuery"
                 placeholder="Search article code, description or system…">
        </div>

        <div style="flex:1"></div>

        <span class="pill" :class="shortageCount ? 'pill-warn' : 'pill-good'" style="cursor:pointer"
              role="button" tabindex="0" @click="report='low'; go('reports')"
              @keydown.enter="report='low'; go('reports')"
              title="Open the replenishment report">
          <span x-text="shortageCount"></span>
          <span class="pill-word" x-text="shortageCount===1 ? 'shortage' : 'shortages'"></span>
        </span>
      </header>

      <div class="view">

        <template x-if="pendingWrites > 0">
          <div class="banner banner-info" style="margin-bottom:1.1rem">
            <div>
              <strong x-text="pendingWrites + (pendingWrites === 1 ? ' change saved on this device' : ' changes saved on this device')"></strong><span
                x-show="!online">, waiting for a connection. Keep working — everything is stored
                here and will send itself the moment you are back online.</span><span
                x-show="online">, sending now…</span>
            </div>
          </div>
        </template>


        <!-- ============ DASHBOARD ============ -->
        <div id="view-dashboard" x-show="currentTab==='dashboard'" class="stack">
          <div class="view-head">
            <div>
              <h2 class="view-title">Main Dashboard Center</h2>
              <p class="view-sub">Live position across all systems and villa projects.</p>
            </div>
            <div class="actions">
              <button class="btn btn-sm" @click="go('wizard')">BOM wizard</button>
              <button class="btn btn-sm" @click="openBooking()" :disabled="!inventory.length">Book to a job</button>
              <button class="btn btn-sm" @click="report='low'; go('reports')">Replenishment report</button>
              <button class="btn btn-sm btn-primary" @click="openItem()">Add profile</button>
            </div>
          </div>

          <div class="kpis">
            <div class="kpi">
              <div class="kpi-label">Total Profile Varieties</div>
              <div class="kpi-value" x-text="fmt(inventory.length)"></div>
              <div class="kpi-foot"
                   x-text="`${fmt(systems.length)} systems · ${fmt(holdingInventory.length)} in ${holdingLabel}`"></div>
            </div>
            <div class="kpi">
              <div class="kpi-label">Total Received</div>
              <div class="kpi-value" style="color:var(--accent)" x-text="fmt(totals.received)"></div>
              <div class="kpi-foot">bars / packets booked in</div>
            </div>
            <div class="kpi">
              <div class="kpi-label">Issued to Cutters</div>
              <div class="kpi-value" style="color:var(--violet)" x-text="fmt(totals.issued)"></div>
              <div class="kpi-foot">consumed by production</div>
            </div>
            <div class="kpi">
              <div class="kpi-label">Net Warehoused Balance</div>
              <div class="kpi-value" style="color:var(--good)" x-text="fmt(totals.balance)"></div>
              <div class="kpi-foot">physically on hand</div>
            </div>
          </div>

          <template x-if="!inventory.length">
            <div class="card empty">
              <div class="empty-title">No stock loaded yet</div>
              <div style="margin-bottom:1rem">
                Import your article list as CSV, add profiles one at a time, or load the
                sample Schüco data to try the app.
              </div>
              <div class="row" style="justify-content:center">
                <button class="btn btn-primary" @click="go('inventory')">Go to Master Stock</button>
                <button class="btn" @click="seedSample()" :disabled="saving">Load sample data</button>
              </div>
            </div>
          </template>

          <template x-if="shortageItems.length">
            <div class="card">
              <div class="card-pad" style="border-bottom:1px solid var(--line)">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap">
                  <div>
                    <h3 style="font-size:.95rem">Critical shortages detected</h3>
                    <p class="view-sub"
                       x-text="`${fmt(shortageCount)} article(s) at or below their minimum. Showing the 12 furthest below.`"></p>
                  </div>
                  <button class="btn btn-sm" @click="report='low'; go('reports')">Full report</button>
                </div>
              </div>
              <div class="table-wrap" style="border:none;border-radius:0">
                <table>
                  <thead><tr>
                    <th>System</th><th>Article</th><th>Description</th>
                    <th class="right">Balance</th><th class="right">Reorder at</th><th class="right">Short by</th>
                  </tr></thead>
                  <tbody>
                    <template x-for="item in shortageItems.slice(0,12)" :key="item.id">
                      <tr class="row-bad">
                        <td class="muted" x-text="item.system_ref || '—'"></td>
                        <td class="mono" style="color:var(--accent);font-weight:700" x-text="item.article_ref"></td>
                        <td x-text="item.description"></td>
                        <td class="right num" x-text="fmt(balanceOf(item))"></td>
                        <td class="right num muted" x-text="fmt(reorderLevel(item))"></td>
                        <td class="right num" style="color:var(--bad);font-weight:700"
                            x-text="fmt(Math.max(0, reorderLevel(item) - balanceOf(item)))"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>

          <template x-if="systemSummary.length">
            <div class="card">
              <div class="card-pad" style="border-bottom:1px solid var(--line)">
                <h3 style="font-size:.95rem">Position by system</h3>
                <p class="view-sub">Click a system to open its stock list.</p>
              </div>
              <div class="table-wrap" style="border:none;border-radius:0">
                <table>
                  <thead><tr>
                    <th>System reference</th><th class="right">Articles</th>
                    <th class="right">Received</th><th class="right">Issued</th>
                    <th class="right">Balance</th><th class="right">Short</th>
                  </tr></thead>
                  <tbody>
                    <template x-for="s in systemSummary" :key="s.name">
                      <tr class="row-link" @click="openSystem(s.name)"
                          role="button" tabindex="0" @keydown.enter="openSystem(s.name)"
                          :title="`Open ${s.name} in Master Stock`">
                        <td style="font-weight:600" x-text="s.name"></td>
                        <td class="right num muted" x-text="fmt(s.count)"></td>
                        <td class="right num" style="color:var(--good)" x-text="fmt(s.received)"></td>
                        <td class="right num" style="color:var(--violet)" x-text="fmt(s.issued)"></td>
                        <td class="right num" style="font-weight:700" x-text="fmt(s.balance)"></td>
                        <td class="right">
                          <span class="pill" :class="s.short ? 'pill-warn' : 'pill-good'" x-text="fmt(s.short)"></span>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>

          <div class="card">
            <div class="card-pad" style="border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:1rem">
              <div>
                <h3 style="font-size:.95rem">Recent stock movements</h3>
                <p class="view-sub">Last 12 transactions across all users.</p>
              </div>
              <button class="btn btn-sm btn-ghost" @click="go('movements')">View all</button>
            </div>
            <template x-if="!movements.length">
              <div class="empty">
                <div class="empty-title">No movements recorded yet</div>
                <div>Receive stock against a profile to start the audit trail.</div>
              </div>
            </template>
            <template x-if="movements.length">
              <div class="table-wrap" style="border:none;border-radius:0">
                <table>
                  <thead><tr>
                    <th>When</th><th>Type</th><th>Article</th><th class="right">Qty</th><th>Project</th><th>By</th>
                  </tr></thead>
                  <tbody>
                    <template x-for="m in movements.slice(0,12)" :key="m.id">
                      <tr>
                        <td class="faint" style="white-space:nowrap" x-text="when(m.at)"></td>
                        <td><span class="pill" :class="moveClass(m.type)" x-text="m.type"></span></td>
                        <td class="mono" style="color:var(--accent)" x-text="m.article_ref"></td>
                        <td class="right num" x-text="(m.type==='issue'?'−':'+')+fmt(m.qty)"></td>
                        <td class="muted truncate" x-text="m.project_code || '—'"></td>
                        <td class="faint truncate" x-text="m.by_name || '—'"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </div>
        </div>

        <!-- ============ INVENTORY ============ -->
        <div id="view-inventory" x-show="currentTab==='inventory'" class="stack">
          <div class="view-head">
            <div>
              <h2 class="view-title">Master Stock Control</h2>
              <p class="view-sub"
                 x-text="`${fmt(filteredInventory.length)} of ${fmt(holdingInventory.length)} articles in ${holdingLabel}`"></p>
            </div>
            <div class="actions">
              <select class="select" style="width:auto;min-width:180px" x-model="selectedHolding"
                      @change="selectedCategory='ALL SYSTEMS'" title="Which stock you are looking at">
                <option value="Stock">Main stock</option>
                <option value="ALL">All holdings</option>
                <template x-for="h in holdings.filter(x => x !== 'Stock')" :key="h">
                  <option :value="h" x-text="'For: ' + h"></option>
                </template>
              </select>
              <select class="select" style="width:auto;min-width:170px" x-model="selectedCategory">
                <option value="ALL SYSTEMS">ALL SYSTEMS</option>
                <template x-for="s in systems" :key="s">
                  <option :value="s" x-text="s"></option>
                </template>
              </select>
              <button class="btn btn-sm" @click="exportCsv()" :disabled="!inventory.length">Export CSV</button>
              <button class="btn btn-sm" @click="importOpen=true">Import CSV</button>
              <button class="btn btn-sm" @click="openLevels()" :disabled="!inventory.length">Min levels</button>
              <button class="btn btn-sm btn-primary" @click="openItem()">Add profile</button>
            </div>
          </div>

          <template x-if="!inventory.length">
            <div class="card empty">
              <div class="empty-title">Your stock list is empty</div>
              <div style="margin-bottom:1rem">
                Import your existing article list as CSV, add profiles one at a time,
                or load the sample Schüco data to see how it works.
              </div>
              <div class="row" style="justify-content:center">
                <button class="btn btn-primary" @click="openItem()">Add first profile</button>
                <button class="btn" @click="importOpen=true">Import CSV</button>
                <button class="btn" @click="seedSample()" :disabled="saving">Load sample data</button>
              </div>
            </div>
          </template>

          <template x-if="inventory.length">
            <div class="stock-cards">
              <template x-for="item in filteredInventory" :key="item.id">
                <div class="stock-card" :class="isShort(item) && 'short'">
                  <div class="stock-card-top">
                    <div style="min-width:0">
                      <div class="mono" style="color:var(--accent);font-weight:700;font-size:.95rem"
                           x-text="item.article_ref"></div>
                      <div style="font-size:.85rem;margin-top:.15rem" x-text="item.description"></div>
                      <div class="faint" style="font-size:.72rem;margin-top:.2rem"
                           x-text="[item.system_ref, item.location, item.unit].filter(Boolean).join(' · ')"></div>
                    </div>
                    <span class="pill" :class="statusClass(item)" x-text="statusLabel(item)"></span>
                  </div>

                  <div class="stock-figs">
                    <div>
                      <div class="stock-fig-label">Received</div>
                      <div class="stock-fig-value" style="color:var(--good)" x-text="fmt(item.received_qty)"></div>
                    </div>
                    <div>
                      <div class="stock-fig-label">Issued</div>
                      <div class="stock-fig-value" style="color:var(--violet)" x-text="fmt(item.issued_qty)"></div>
                    </div>
                    <div>
                      <div class="stock-fig-label">Balance</div>
                      <div class="stock-fig-value"
                           :style="{ color: balanceOf(item) < 0 ? 'var(--bad)' : '' }"
                           x-text="fmt(balanceOf(item))"></div>
                    </div>
                  </div>

                  <div class="row" style="gap:.4rem">
                    <button class="btn btn-sm" style="flex:1" @click="openMove(item,'receive')">Receive</button>
                    <button class="btn btn-sm" style="flex:1" @click="openMove(item,'issue')">Issue</button>
                    <button class="btn btn-sm btn-ghost" @click="openItem(item)">Edit</button>
                  </div>
                </div>
              </template>
            </div>
          </template>

          <template x-if="inventory.length">
            <div class="table-wrap stock-table">
              <table>
                <thead><tr>
                  <th x-show="selectedHolding==='ALL'">Held for</th>
                  <th>System</th>
                  <th>Article</th>
                  <th style="width:40%">Description</th>
                  <th class="right">Received</th>
                  <th class="right">Issued</th>
                  <th class="right">Balance</th>
                  <th>Status</th>
                  <th class="right"><span class="faint">Actions</span></th>
                </tr></thead>
                <tbody>
                  <template x-for="item in filteredInventory" :key="item.id">
                    <tr :class="isShort(item) && 'row-bad'">
                      <td class="faint truncate" style="max-width:150px" x-show="selectedHolding==='ALL'"
                          x-text="holdingOf(item)"></td>
                      <td class="muted" style="white-space:nowrap" x-text="item.system_ref || '—'"></td>
                      <td class="mono" style="color:var(--accent);font-weight:700" x-text="item.article_ref"></td>
                      <td>
                        <div x-text="item.description"></div>
                        <div class="faint" style="font-size:.72rem"
                             x-text="[item.location, item.unit].filter(Boolean).join(' · ')"></div>
                      </td>
                      <td class="right num" style="color:var(--good)" x-text="fmt(item.received_qty)"></td>
                      <td class="right num" style="color:var(--violet)" x-text="fmt(item.issued_qty)"></td>
                      <td class="right num"
                          :style="{ fontWeight: 700, color: balanceOf(item) < 0 ? 'var(--bad)' : '' }"
                          x-text="fmt(balanceOf(item))"></td>
                      <td><span class="pill" :class="statusClass(item)" x-text="statusLabel(item)"></span></td>
                      <td>
                        <div class="cell-actions">
                          <button class="btn btn-sm" @click="openMove(item,'receive')">Receive</button>
                          <button class="btn btn-sm" @click="openMove(item,'issue')">Issue</button>
                          <button class="btn btn-sm btn-ghost" @click="openItem(item)">Edit</button>
                        </div>
                      </td>
                    </tr>
                  </template>
                </tbody>
                <tfoot>
                  <tr>
                    <td colspan="3" class="muted" style="font-weight:600">Totals (filtered)</td>
                    <td class="right num" x-text="fmt(filteredTotals.received)"></td>
                    <td class="right num" x-text="fmt(filteredTotals.issued)"></td>
                    <td class="right num" x-text="fmt(filteredTotals.balance)"></td>
                    <td colspan="2"></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          </template>
        </div>

        <!-- ============ MOVEMENTS ============ -->
        <div id="view-movements" x-show="currentTab==='movements'" class="stack">
          <div class="view-head">
            <div>
              <h2 class="view-title">Movement Ledger</h2>
              <p class="view-sub">Every receipt, issue and adjustment, newest first. Rows cannot be edited or deleted.</p>
            </div>
            <div class="actions">
              <select class="select" style="width:auto" x-model="moveFilter" @change="ledgerShown = 300">
                <option value="">All types</option>
                <option value="receive">Receipts</option>
                <option value="issue">Issues</option>
                <option value="adjust">Adjustments</option>
              </select>
            </div>
          </div>

          <template x-if="!filteredMovements.length">
            <div class="card empty"><div class="empty-title">Nothing to show</div>
              <div>Movements appear here as soon as stock is received or issued.</div></div>
          </template>

          <template x-if="filteredMovements.length">
            <div class="table-wrap">
              <table>
                <thead><tr>
                  <th>When</th><th>Type</th><th>Article</th><th>Description</th>
                  <th class="right">Qty</th><th>From</th><th>Project</th><th>Note</th><th>By</th>
                </tr></thead>
                <tbody>
                  <template x-for="m in visibleMovements" :key="m.id">
                    <tr>
                      <td class="faint" style="white-space:nowrap" x-text="when(m.at)"></td>
                      <td><span class="pill" :class="moveClass(m.type)" x-text="m.type"></span></td>
                      <td class="mono" style="color:var(--accent)" x-text="m.article_ref"></td>
                      <td class="muted truncate" style="max-width:240px" x-text="m.description || '—'"></td>
                      <td class="right num" x-text="(m.type==='issue'?'−':'+')+fmt(m.qty)"></td>
                      <td class="faint truncate" style="max-width:150px" x-text="m.holding || 'Stock'"></td>
                      <td class="muted" x-text="m.project_code || '—'"></td>
                      <td class="faint truncate" style="max-width:200px" x-text="m.note || '—'"></td>
                      <td class="faint truncate" x-text="m.by_name || '—'"></td>
                    </tr>
                  </template>
                </tbody>
              </table>
            </div>
          </template>

          <template x-if="filteredMovements.length > visibleMovements.length">
            <div class="card" style="text-align:center;padding:.9rem">
              <span class="muted" x-text="`Showing ${visibleMovements.length} of ${filteredMovements.length} movements.`"></span>
              <button class="btn btn-sm" style="margin-left:.6rem" @click="ledgerShown += 300">Show 300 more</button>
              <button class="btn btn-sm btn-ghost" @click="ledgerShown = filteredMovements.length">Show all</button>
            </div>
          </template>
        </div>

        <!-- ============ BOM WIZARD ============ -->
        <div id="view-wizard" x-show="currentTab==='wizard'" class="stack">
          <div class="view-head">
            <div>
              <h2 class="view-title">System BOM Wizard</h2>
              <p class="view-sub">Check a package bundle against live stock, then batch-book it to a villa project.</p>
            </div>
            <div class="actions">
              <button class="btn btn-sm btn-primary" @click="openBom()">New BOM template</button>
            </div>
          </div>

          <template x-if="!boms.length">
            <div class="card empty">
              <div class="empty-title">No BOM templates yet</div>
              <div style="margin-bottom:1rem;max-width:560px;margin-left:auto;margin-right:auto">
                A template lists the profiles consumed <strong>per unit</strong> of a system —
                ASE 36 pocket sliding door, AWS 65 window, ASE 54 PD, and so on.
                You can seed one from an existing system group and then correct the quantities.
              </div>
              <button class="btn btn-primary" @click="openBom()">Create first template</button>
            </div>
          </template>

          <template x-if="boms.length">
            <div class="stack">
              <div class="card card-pad">
                <div class="grid-3">
                  <div class="field">
                    <label class="label">1. System fabrication variant</label>
                    <select class="select" x-model="wizard.bomId">
                      <option value="">— Choose system —</option>
                      <template x-for="b in boms" :key="b.id">
                        <option :value="b.id" x-text="b.name"></option>
                      </template>
                    </select>
                  </div>
                  <div class="field">
                    <label class="label">2. Number of units</label>
                    <input class="input num" type="number" min="1" step="1" x-model.number="wizard.units">
                  </div>
                  <div class="field">
                    <label class="label">3. Target villa project</label>
                    <select class="select" x-model="wizard.projectId">
                      <option value="">— Select project destination —</option>
                      <template x-for="p in projects" :key="p.id">
                        <option :value="p.id" x-text="p.project_code"></option>
                      </template>
                    </select>
                  </div>
                </div>

                <template x-if="selectedBom">
                  <div class="row" style="margin-top:1rem;justify-content:space-between">
                    <span class="hint"
                          x-text="`${(selectedBom.lines||[]).length} lines · ${selectedBom.system_ref || 'no system reference'}`"></span>
                    <div class="row">
                      <button class="btn btn-sm btn-ghost" @click="openBom(selectedBom)">Edit template</button>
                      <button class="btn btn-sm btn-primary" @click="issueBundle()"
                              :disabled="!wizardLines.length || !wizard.projectId || issuing">
                        <span x-show="issuing" class="spinner"></span>
                        <span>Batch book package bundle</span>
                      </button>
                    </div>
                  </div>
                </template>
                <template x-if="selectedBom && !wizard.projectId">
                  <p class="hint" style="margin-top:.5rem;text-align:right">
                    Select a project destination to enable booking.
                  </p>
                </template>
              </div>

              <template x-if="wizardShortage">
                <div class="banner banner-warn">
                  <div>
                    <strong>Insufficient stock for this bundle.</strong><br>
                    <span x-text="`${wizardLines.filter(l=>l.short>0||!l.known).length} of ${wizardLines.length} lines cannot be covered by the current warehouse balance. Booking anyway drives those articles negative — the ledger stays correct, but the shortfall has to be purchased.`"></span>
                  </div>
                </div>
              </template>

              <template x-if="wizardLines.length">
                <div class="table-wrap">
                  <table>
                    <thead><tr>
                      <th>Article</th><th>Material Description</th>
                      <th class="right">Per unit</th><th class="right">Required count</th>
                      <th class="right">On hand</th><th class="right">Short by</th><th>Status</th>
                    </tr></thead>
                    <tbody>
                      <template x-for="l in wizardLines" :key="l.article_ref">
                        <tr :class="(l.short>0 || !l.known) && 'row-bad'">
                          <td class="mono" style="color:var(--accent);font-weight:700" x-text="l.article_ref"></td>
                          <td x-text="l.description"></td>
                          <td class="right num muted" x-text="fmt(l.qty_per)"></td>
                          <td class="right num" style="font-weight:700" x-text="fmt(l.required)"></td>
                          <td class="right num" x-text="l.known ? fmt(l.on_hand) : '—'"></td>
                          <td class="right num" :style="l.short>0 ? 'color:var(--bad);font-weight:700' : 'color:var(--faint)'"
                              x-text="fmt(l.short)"></td>
                          <td>
                            <span class="pill" :class="!l.known ? 'pill-bad' : (l.short>0 ? 'pill-warn' : 'pill-good')"
                                  x-text="!l.known ? 'not in stock list' : (l.short>0 ? 'short' : 'available')"></span>
                          </td>
                        </tr>

                  <button class="btn btn-sm btn-ghost" @click="openProject(p)">Edit</button>
                  <button class="btn btn-sm btn-danger" @click="removeProject(p)">Delete</button>
                </div>

                  <table>
                    <thead><tr>
                      <th>Article</th><th>Material Description</th><th>System</th>
                      <th class="right">Qty booked</th><th class="right">Bookings</th><th>Last booked</th>
                    </tr></thead>

                      <template x-for="l in projectLines(p.id)" :key="l.article_ref">
                        <tr>
                          <td class="mono" style="color:var(--accent);font-weight:700" x-text="l.article_ref"></td>
                          <td x-text="l.description"></td>
                          <td class="muted" x-text="l.system_ref || '—'"></td>
                          <td class="right num" style="font-weight:700" x-text="fmt(l.qty)"></td>
                          <td class="right num muted" x-text="fmt(l.count)"></td>

                  </table>
                </div>

            </div>

        <!-- ============ SETTINGS ============ -->
        <!-- ============ MTO IMPORT ============ -->
        <div id="view-mto" x-show="currentTab==='mto'" class="stack">
          <div class="view-head">
            <div>
              <h2 class="view-title">MTO Import</h2>
              <p class="view-sub">Read a Logikal material analysis and book the whole job off stock in one go.</p>
            </div>
            <div class="actions">
              <label class="btn btn-sm btn-primary" style="cursor:pointer">
                <span x-show="mtoBusy" class="spinner"></span>
                <span x-text="mto.lines.length ? 'Choose another file' : 'Choose MTO file'"></span>
                <input type="file" accept=".xlsx,.xls,.xlsm" style="display:none" @change="readMtoFile($event)">
              </label>
              <button class="btn btn-sm" x-show="mto.lines.length" @click="clearMto()">Clear</button>
            </div>
          </div>

          <template x-if="!mto.lines.length">
            <div class="card empty">
              <div class="empty-title">No MTO loaded</div>
              <div style="margin-bottom:1rem;max-width:56ch;margin-inline:auto">
                Choose the <strong>Material analysis</strong> spreadsheet Logikal produces for a job.
                The app reads its Profiles, Hardware, Accessories and Gaskets sections, matches every
                article against your stock list, and shows you exactly what it will deduct before
                anything is posted.
              </div>
              <p class="hint" style="max-width:56ch;margin-inline:auto">
                Profiles are deducted as whole bars (the Quantity column, as the optimiser worked it
                out). Hardware, accessories and gaskets are deducted as pieces, metres or pairs (the
                Required column), because that is how your stock counts them. Every line stays
                editable below.
              </p>
            </div>
          </template>

          <template x-if="mto.lines.length">
            <div class="stack">
              <div class="card">
                <div class="card-pad">
                  <div class="row" style="justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap">

                      <h3 style="font-size:1rem" x-text="mto.project || mto.fileName"></h3>
                      <p class="view-sub">
                        <span class="mono" style="font-size:.78rem" x-text="mto.fileName"></span>

                      </p>
                    </div>
                    <div class="row" style="gap:1.4rem">
                      <div class="right">
                        <div class="num" style="font-size:1.2rem;font-weight:700" x-text="fmt(mto.lines.length)"></div>
                        <div class="faint" style="font-size:.7rem">LINES</div>
                      </div>
                      <div class="right">
                        <div class="num" style="font-size:1.2rem;font-weight:700;color:var(--good)"

                        <div class="faint" style="font-size:.7rem">IN STOCK LIST</div>
                      </div>
                      <div class="right">
                        <div class="num" style="font-size:1.2rem;font-weight:700"
                             :style="mtoMissing.length ? 'color:var(--warn)' : ''" x-text="fmt(mtoMissing.length)"></div>
                        <div class="faint" style="font-size:.7rem">WILL BE CREATED</div>
                      </div>
                      <div class="right">
                        <div class="num" style="font-size:1.2rem;font-weight:700"
                             :style="mtoNegative.length ? 'color:var(--bad)' : ''" x-text="fmt(mtoNegative.length)"></div>
                        <div class="faint" style="font-size:.7rem">GO NEGATIVE</div>
                      </div>
                    </div>
                  </div>

                  <div class="grid-2" style="margin-top:1rem">
                    <div class="field">
                      <label class="label">Book to job *</label>
                      <select id="mto-project" class="select" x-show="!mtoNewProject" x-model="mto.projectId"
                              @change="mto.projectId==='__new' && (mtoNewProject=true, mto.projectId='')">
                        <option value="">&mdash; Choose a job &mdash;</option>
                        <template x-for="p in projects" :key="p.id">
                          <option :value="p.id" x-text="p.project_code"></option>
                        </template>
                        <option value="__new">+ Create a new job&hellip;</option>
                      </select>
                      <div class="row" x-show="mtoNewProject" style="gap:.4rem">
                        <input class="input" x-model.trim="mto.newProject" placeholder="Job name">
                        <button type="button" class="btn btn-sm"
                                @click="mtoNewProject=false; mto.newProject=''">Cancel</button>
                      </div>
                      <span class="hint" x-show="mtoNewProject && mto.newProject">Taken from the file &mdash; edit if your job is named differently.</span>
                    </div>
                    <div class="field">
                      <label class="label">Draw from *</label>
                      <select id="mto-holding" class="select" x-model="mto.holding">
                        <option value="Stock">Main stock</option>
                        <template x-for="h in holdings.filter(x => x !== 'Stock')" :key="h">
                          <option :value="h" x-text="'Allocated to ' + h"></option>
                        </template>
                      </select>
                    </div>
                  </div>
                  <div class="grid-2">
                    <div class="field">
                      <label class="label">System *</label>
                      <select id="mto-system" class="select" x-model="mto.system">
                        <option value="">&mdash; Choose a system &mdash;</option>
                        <template x-for="sy in systemOptions" :key="sy">
                          <option :value="sy" x-text="sy"></option>
                        </template>
                      </select>
                      <span class="hint" x-show="mto.systemGuessed">Guessed from the file name &mdash; change it if wrong.</span>
                    </div>
                  </div>
                  <div class="field">
                    <label class="label">Note (optional)</label>
                    <input class="input" x-model.trim="mto.note" placeholder="e.g. released to production 24-09">
                  </div>
                </div>
              </div>

              <template x-if="mtoMissing.length">
                <div class="banner banner-warn">
                  <div>
                    <strong x-text="`${fmt(mtoMissing.length)} article(s) are not in your stock list.`"></strong>
                    They will be created at zero and go straight to negative, so the job's real
                    consumption is recorded:
                    <span class="mono" style="font-size:.78rem"
                          x-text="mtoMissing.slice(0,8).map(l => l.art).join(', ') + (mtoMissing.length > 8 ? '…' : '')"></span>
                  </div>
                </div>
              </template>

              <div class="card">
                <div class="card-pad" style="border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap">
                  <div>
                    <h3 style="font-size:.95rem">What will be deducted</h3>
                    <p class="view-sub">Every figure is editable. Set a line to zero to leave it out.</p>
                  </div>
                  <input class="input" style="max-width:260px" x-model.trim="mtoSearch"
                         placeholder="Filter by code or description">
                </div>
                <div class="table-wrap" style="border:none;border-radius:0">
                  <table>
                    <thead><tr>
                      <th>Section</th><th>Article</th><th>Description</th>
                      <th class="right">MTO qty</th><th class="right">PU</th>
                      <th class="right">Required</th><th>Unit</th>
                      <th class="right">Deduct</th><th class="right">On hand</th>
                      <th class="right">After</th><th>In holding</th>
                    </tr></thead>
                    <tbody>
                      <template x-for="l in mtoVisible" :key="l.art + l.sec">
                        <tr :class="mtoAfter(l) < 0 && 'row-bad'">
                          <td class="faint" x-text="l.sec"></td>
                          <td class="mono" style="color:var(--accent);font-weight:700" x-text="l.art"></td>
                          <td class="truncate" style="max-width:230px" x-text="l.desc"></td>
                          <td class="right num muted" x-text="fmt(l.qty)"></td>
                          <td class="right num faint" x-text="l.pu ? fmt(l.pu) : '—'"></td>
                          <td class="right num muted" x-text="fmt(l.req)"></td>
                          <td class="faint" x-text="l.unit || '—'"></td>
                          <td class="right">
                            <input class="input num" type="number" min="0" step="any"
                                   style="max-width:110px;margin-left:auto"
                                   :value="l.deduct" @input="l.deduct = num($event.target.value)">
                          </td>
                          <td class="right num" x-text="mtoItem(l.art) ? fmt(balanceOf(mtoItem(l.art))) : '—'"></td>
                          <td class="right num" style="font-weight:700"
                              :style="mtoAfter(l) < 0 ? 'color:var(--bad);font-weight:700' : 'font-weight:700'"
                              x-text="fmt(mtoAfter(l))"></td>
                          <td>
                            <span class="pill" :class="mtoItem(l.art) ? 'pill-good' : 'pill-warn'"
                                  x-text="mtoItem(l.art) ? 'known' : 'new'"></span>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
                <div class="card-pad" style="border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap">
                  <span class="faint" style="font-size:.82rem"
                        x-text="`${fmt(mtoActive.length)} line(s) will post` +
                                (mtoVisible.length !== mto.lines.length ? ` · showing ${fmt(mtoVisible.length)} of ${fmt(mto.lines.length)}` : '')"></span>
                  <button class="btn btn-primary" @click="postMto()"
                          :disabled="mtoPosting || !mtoActive.length || !mto.system || (!mto.projectId && !mto.newProject)">
                    <span x-show="mtoPosting" class="spinner"></span><span>Deduct from stock</span>
                  </button>
                </div>
              </div>
            </div>
          </template>
        </div>

        <!-- ============ REPORTS ============ -->
        <div id="view-reports" x-show="currentTab==='reports'" class="stack">
          <div class="view-head">
            <div>
              <h2 class="view-title">Reports</h2>
              <p class="view-sub"
                 x-text="`Current stock by system, and everything below its minimum \u2014 for ${holdingLabel}.`"></p>
            </div>
            <div class="actions">
              <select class="select" style="width:auto;min-width:160px" x-model="selectedHolding">
                <option value="Stock">Main stock</option>
                <option value="ALL">All holdings</option>
                <template x-for="h in holdings.filter(x => x !== 'Stock')" :key="h">
                  <option :value="h" x-text="'For: ' + h"></option>
                </template>
              </select>
              <div class="seg">
                <button :class="report==='stock' && 'on'" @click="report='stock'">Stock by system</button>
                <button :class="report==='low' && 'on'" @click="report='low'">Below minimum</button>
              </div>
              <button class="btn btn-sm" @click="report==='stock' ? exportStockReport() : exportLowReport()"
                      :disabled="!inventory.length">Export CSV</button>
            </div>
          </div>

          <!-- ---- stock by system ---- -->
          <template x-if="report==='stock'">
            <div class="stack">
              <template x-if="!inventory.length">
                <div class="card empty">
                  <div class="empty-title">Nothing in stock yet</div>
                  <div>Import your stock list and this report fills itself in.</div>
                </div>
              </template>

              <template x-if="inventory.length">
                <div class="kpis">
                  <div class="kpi">
                    <div class="kpi-label">Systems</div>
                    <div class="kpi-value" x-text="fmt(systemSummary.length)"></div>
                    <div class="kpi-foot" x-text="`${fmt(inventory.length)} articles in total`"></div>
                  </div>
                  <div class="kpi">
                    <div class="kpi-label">On Hand</div>
                    <div class="kpi-value" style="color:var(--good)" x-text="fmt(totals.balance)"></div>
                    <div class="kpi-foot">received less issued</div>
                  </div>
                  <div class="kpi">
                    <div class="kpi-label">Below Minimum</div>
                    <div class="kpi-value" :style="shortageCount ? 'color:var(--bad)' : ''" x-text="fmt(shortageCount)"></div>
                    <div class="kpi-foot">articles needing replenishment</div>
                  </div>
                  <div class="kpi">
                    <div class="kpi-label">Negative</div>
                    <div class="kpi-value" :style="negativeCount ? 'color:var(--bad)' : ''" x-text="fmt(negativeCount)"></div>
                    <div class="kpi-foot">issued more than was received</div>
                  </div>
                </div>
              </template>

              <template x-for="g in systemSummary" :key="g.name">
                <div class="card">
                  <button type="button" class="group-head" :class="openGroups[g.name] && 'open'"
                          @click="toggleGroup(g.name)">
                    <svg class="caret" width="14" height="14" viewBox="0 0 24 24" fill="none"
                         stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M9 18l6-6-6-6"/>
                    </svg>
                    <span class="grow">
                      <span style="font-weight:700" x-text="g.name"></span>
                      <span class="faint" style="font-size:.78rem;margin-left:.5rem"
                            x-text="`${fmt(g.count)} articles`"></span>
                    </span>
                    <span class="pill" :class="g.short ? 'pill-warn' : 'pill-good'"
                          x-text="g.short ? `${fmt(g.short)} low` : 'all above min'"></span>
                    <span class="num" style="font-weight:700;min-width:6rem;text-align:right"
                          x-text="fmt(g.balance)"></span>
                  </button>

                  <template x-if="openGroups[g.name]">
                    <div class="table-wrap" style="border:none;border-radius:0">
                      <table>
                        <thead><tr>
                          <th>Article</th><th>Description</th><th>Unit</th>
                          <th class="right">Received</th><th class="right">Issued</th>
                          <th class="right">Balance</th><th class="right">Min</th><th>Status</th>
                        </tr></thead>
                        <tbody>
                          <template x-for="i in systemItems(g.name)" :key="i.id">
                            <tr :class="isShort(i) && 'row-bad'">
                              <td class="mono" style="color:var(--accent);font-weight:700" x-text="i.article_ref"></td>
                              <td x-text="i.description"></td>
                              <td class="faint" x-text="i.unit || '—'"></td>
                              <td class="right num" style="color:var(--good)" x-text="fmt(i.received_qty)"></td>
                              <td class="right num" style="color:var(--violet)" x-text="fmt(i.issued_qty)"></td>
                              <td class="right num" style="font-weight:700"
                                  :style="balanceOf(i) < 0 ? 'color:var(--bad);font-weight:700' : 'font-weight:700'"
                                  x-text="fmt(balanceOf(i))"></td>
                              <td class="right num muted" x-text="fmt(reorderLevel(i))"></td>
                              <td><span class="pill" :class="statusClass(i)" x-text="statusLabel(i)"></span></td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>

          <!-- ---- below minimum ---- -->
          <template x-if="report==='low'">

              <div class="card">
                <div class="card-pad" style="display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap">
                  <div>
                    <h3 style="font-size:.95rem">Replenishment report</h3>
                    <p class="view-sub"
                       x-text="`${fmt(shortageCount)} of ${fmt(inventory.length)} articles are at or below their minimum. Default minimum is ${fmt(settings.shortageThreshold)} where no article minimum is set.`"></p>
                  </div>
                  <button class="btn btn-sm" @click="openLevels()">Set minimum levels</button>
                </div>
              </div>

              <template x-if="!shortageItems.length">
                <div class="card empty">
                  <div class="empty-title">Nothing below its minimum</div>
                  <div>Every article is above its reorder level.</div>
                </div>
              </template>

              <template x-if="shortageItems.length">
                <div class="table-wrap">
                  <table>
                    <thead><tr>
                      <th>System</th><th>Article</th><th>Description</th><th>Unit</th>
                      <th class="right">Balance</th><th class="right">Minimum</th>
                      <th class="right">Order at least</th><th>Status</th><th class="right">Actions</th>
                    </tr></thead>
                    <tbody>
                      <template x-for="i in shortageItems" :key="i.id">
                        <tr class="row-bad">
                          <td class="muted truncate" style="max-width:190px" x-text="i.system_ref || '—'"></td>
                          <td class="mono" style="color:var(--accent);font-weight:700" x-text="i.article_ref"></td>
                          <td x-text="i.description"></td>
                          <td class="faint" x-text="i.unit || '—'"></td>
                          <td class="right num" :style="balanceOf(i) < 0 ? 'color:var(--bad);font-weight:700' : 'font-weight:700'"
                              x-text="fmt(balanceOf(i))"></td>
                          <td class="right num muted" x-text="fmt(reorderLevel(i))"></td>
                          <td class="right num" style="color:var(--bad);font-weight:700"
                              x-text="fmt(Math.max(0, reorderLevel(i) - balanceOf(i)))"></td>
                          <td><span class="pill" :class="statusClass(i)" x-text="statusLabel(i)"></span></td>
                          <td class="right">
                            <div class="cell-actions">
                              <button class="btn btn-sm" @click="openMove(i,'receive')">Receive</button>
                              <button class="btn btn-sm btn-ghost" @click="openItem(i)">Edit</button>
                            </div>
                          </td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </template>
            </div>
          </template>
        </div>

        <div id="view-settings" x-show="currentTab==='settings'" class="stack">
          <div class="view-head">

              <p class="view-sub">Shared by everyone using this database.</p>
            </div>
          </div>

          <div class="card card-pad stack" style="max-width:660px">
            <div class="field">
              <label class="label">Default reorder threshold</label>
              <input class="input num" type="number" min="0" step="any" x-model.number="settings.shortageThreshold">
              <span class="hint">
                Used for any article with no reorder level of its own. A profile counts as short
