<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Eurolux Inventory &amp; Stock Control</title>
<meta name="description" content="Aluminium profile inventory, BOM allocation and stock control for Eurolux fabrication.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0284c7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Eurolux">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<style>
/* ===========================================================================
   Design tokens
   =========================================================================== */
:root{
  --bg:#0f172a; --bg-2:#0b1220; --panel:#111c30; --panel-2:#16233b;
  --line:#1e2f4a; --line-soft:#1a2942;
  --text:#e8eef7; --muted:#93a4bd; --faint:#64748b;
  --accent:#38bdf8; --accent-solid:#0284c7; --accent-dim:rgba(56,189,248,.12);
  --good:#34d399; --warn:#fbbf24; --bad:#f87171; --violet:#a78bfa;
  --radius:14px; --radius-sm:10px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
[x-cloak]{display:none!important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#274060;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#33547c}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--accent)}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}

/* ===========================================================================
   Primitives
   =========================================================================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.6rem 1rem;border-radius:var(--radius-sm);font-size:.875rem;font-weight:600;
  border:1px solid var(--line);background:var(--panel-2);color:var(--text);
  transition:background .15s,border-color .15s,opacity .15s;white-space:nowrap;
}
.btn:hover{background:#1c2c48;border-color:#2b4368}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:disabled:hover{background:var(--panel-2);border-color:var(--line)}
.btn-primary{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff}
.btn-primary:hover{background:#0369a1;border-color:#0369a1}
.btn-primary:disabled:hover{background:var(--accent-solid);border-color:var(--accent-solid)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn-ghost:hover{background:var(--panel-2);color:var(--text);border-color:transparent}
.btn-danger{background:rgba(248,113,113,.12);border-color:rgba(248,113,113,.35);color:#fca5a5}
.btn-danger:hover{background:rgba(248,113,113,.2);border-color:rgba(248,113,113,.5)}
.btn-sm{padding:.35rem .6rem;font-size:.78rem;border-radius:8px}
.btn-block{width:100%}

.field{display:flex;flex-direction:column;gap:.35rem;min-width:0}
.label{font-size:.7rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.input,.select,.textarea{
  width:100%;background:var(--bg-2);border:1px solid var(--line);
  border-radius:var(--radius-sm);padding:.6rem .75rem;font-size:.9rem;
  transition:border-color .15s,box-shadow .15s;
}
.input:focus,.select:focus,.textarea:focus{
  outline:none;border-color:var(--accent-solid);box-shadow:0 0 0 3px var(--accent-dim);
}
.input::placeholder{color:var(--faint)}
.select{appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path fill='none' stroke='%2393a4bd' stroke-width='1.6' d='M1 1.5l5 5 5-5'/></svg>");
  background-repeat:no-repeat;background-position:right .7rem center;padding-right:2rem}
.textarea{resize:vertical;min-height:72px}
.hint{font-size:.75rem;color:var(--faint)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.card-pad{padding:1.1rem 1.25rem}

.pill{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .55rem;border-radius:999px;
  font-size:.7rem;font-weight:700;letter-spacing:.03em;border:1px solid transparent;white-space:nowrap}
.pill-good{background:rgba(52,211,153,.12);color:var(--good);border-color:rgba(52,211,153,.25)}
.pill-warn{background:rgba(251,191,36,.12);color:var(--warn);border-color:rgba(251,191,36,.28)}
.pill-bad{background:rgba(248,113,113,.12);color:var(--bad);border-color:rgba(248,113,113,.28)}
.pill-info{background:var(--accent-dim);color:var(--accent);border-color:rgba(56,189,248,.25)}
.pill-mute{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.dot{width:7px;height:7px;border-radius:999px;background:currentColor;flex:none}

.mono{font-family:var(--mono)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.right{text-align:right}
.truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ===========================================================================
   Shell
   =========================================================================== */
.shell{display:flex;height:100dvh;overflow:hidden}
.sidebar{
  width:264px;flex:none;background:var(--bg-2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;justify-content:space-between;
  padding-bottom:env(safe-area-inset-bottom);
}
.brand{display:flex;align-items:center;gap:.7rem;padding:1rem 1.1rem;border-bottom:1px solid var(--line)}
.brand-mark{
  background:linear-gradient(135deg,#0284c7,#0ea5e9);color:#fff;font-weight:800;
  font-size:.7rem;letter-spacing:.12em;padding:.5rem .55rem;border-radius:10px;flex:none
}
.brand-name{font-size:.8rem;font-weight:700;line-height:1.15;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.brand-sub{font-size:.62rem;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;font-weight:600}
.nav{padding:.75rem;display:flex;flex-direction:column;gap:.15rem}
.nav-item{
  display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;
  padding:.65rem .8rem;border-radius:var(--radius-sm);font-size:.875rem;font-weight:550;
  color:var(--muted);transition:background .15s,color .15s
}
.nav-item:hover{background:var(--panel);color:var(--text)}
.nav-item.active{background:var(--accent-dim);color:var(--accent);box-shadow:inset 2px 0 0 var(--accent-solid)}
.nav-item .ico{width:18px;height:18px;flex:none}
.nav-badge{margin-left:auto;font-size:.68rem;font-weight:700;padding:.05rem .4rem;border-radius:999px;
  background:rgba(248,113,113,.15);color:var(--bad)}
.side-foot{padding:.9rem 1rem;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:.6rem}
.who{display:flex;align-items:center;gap:.6rem;min-width:0}
.avatar{width:30px;height:30px;border-radius:999px;background:var(--accent-solid);color:#fff;
  display:grid;place-items:center;font-size:.72rem;font-weight:700;flex:none}

.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.topbar{
  height:60px;flex:none;border-bottom:1px solid var(--line);background:rgba(11,18,32,.6);
  backdrop-filter:blur(8px);display:flex;align-items:center;gap:.75rem;padding:0 1.25rem
}
.search{position:relative;flex:1;max-width:460px}
.search .input{padding-left:2.2rem}
.search svg{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--faint)}
.view{flex:1;overflow-y:auto;padding:1.5rem;-webkit-overflow-scrolling:touch}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.1rem;flex-wrap:wrap}
.view-title{font-size:1.15rem;font-weight:700}
.view-sub{font-size:.82rem;color:var(--muted);margin-top:.15rem}
.actions{display:flex;gap:.5rem;flex-wrap:wrap}
.menu-btn{display:none}

/* ===========================================================================
   Data display
   =========================================================================== */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.2rem}
.kpi-label{font-size:.68rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi-value{font-size:1.9rem;font-weight:700;margin-top:.4rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi-foot{font-size:.74rem;color:var(--faint);margin-top:.3rem}

.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--panel)}
table{width:100%;border-collapse:collapse;font-size:.85rem}
thead th{
  position:sticky;top:0;z-index:1;background:var(--panel-2);color:var(--muted);
  font-size:.68rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  padding:.7rem .7rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap
}
tbody td{padding:.7rem .7rem;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(56,189,248,.04)}
tbody tr.row-bad{background:rgba(248,113,113,.05)}
tfoot td{padding:.7rem .7rem;border-top:1px solid var(--line);background:var(--panel-2);font-weight:700}
.cell-actions{display:flex;gap:.3rem;justify-content:flex-end}

.empty{padding:3rem 1.5rem;text-align:center;color:var(--faint)}
.empty-title{color:var(--muted);font-weight:600;margin-bottom:.3rem}

/* ===========================================================================
   Modals / toasts / auth
   =========================================================================== */
.backdrop{
  position:fixed;inset:0;z-index:60;background:rgba(6,11,22,.72);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;padding:1rem
}
.modal{
  width:100%;max-width:640px;max-height:88dvh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;
  padding:1rem 1.25rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.modal-body{padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
.modal-foot{padding:1rem 1.25rem;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:.6rem;
  position:sticky;bottom:0;background:var(--panel)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1rem}

.toasts{position:fixed;z-index:80;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;max-width:min(92vw,380px)}
.toast{background:var(--panel-2);border:1px solid var(--line);border-left-width:3px;border-radius:var(--radius-sm);
  padding:.7rem .9rem;font-size:.85rem;box-shadow:var(--shadow)}
.toast.ok{border-left-color:var(--good)}
.toast.err{border-left-color:var(--bad)}
.toast.info{border-left-color:var(--accent)}

.auth-screen{min-height:100dvh;display:grid;place-items:center;padding:1.25rem;
  background:radial-gradient(1000px 600px at 50% -10%,rgba(2,132,199,.18),transparent 60%),var(--bg)}
.auth-card{width:100%;max-width:410px}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin-bottom:1.5rem;text-align:center}
.seg{display:flex;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:3px;gap:3px}
.seg button{flex:1;padding:.45rem;border-radius:8px;font-size:.82rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel-2);color:var(--text)}
.linkish{background:none;border:none;color:var(--accent);font-size:.82rem;
  text-decoration:underline;text-underline-offset:3px;padding:.2rem;align-self:center}
.linkish:hover{color:var(--text)}
.linkish:disabled{opacity:.5;cursor:not-allowed}

.banner{display:flex;gap:.7rem;align-items:flex-start;padding:.8rem .95rem;border-radius:var(--radius-sm);
  font-size:.83rem;border:1px solid;line-height:1.5}
.banner-warn{background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.3);color:#fcd34d}
.banner-bad{background:rgba(248,113,113,.08);border-color:rgba(248,113,113,.3);color:#fca5a5}
.banner-info{background:var(--accent-dim);border-color:rgba(56,189,248,.28);color:#7dd3fc}

.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.25);border-top-color:#fff;
  border-radius:999px;animation:spin .7s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.boot{min-height:100dvh;display:grid;place-items:center;color:var(--muted);gap:.8rem;padding:1.5rem}

.bom-line{display:grid;grid-template-columns:1.1fr 1.6fr .6fr auto;gap:.6rem;align-items:end}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}

/* Stock cards — the phone view of the master stock table. */
.stock-cards{display:none}
.stock-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1rem}
.stock-card.short{border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.04)}
.stock-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem}
.stock-figs{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin:.75rem 0;
  padding:.6rem 0;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)}
.stock-fig-label{font-size:.6rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.stock-fig-value{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:1.05rem;font-weight:700;margin-top:.1rem}

/* ===========================================================================
   Responsive
   =========================================================================== */
@media (max-width:900px){
  .grid-3{grid-template-columns:1fr 1fr}
  .bom-line{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .sidebar{
    position:fixed;inset:0 auto 0 0;z-index:70;transform:translateX(-100%);
    transition:transform .22s ease;box-shadow:var(--shadow)
  }
  .sidebar.open{transform:none}
  .menu-btn{display:inline-flex}
  .view{padding:1rem;padding-bottom:calc(1rem + env(safe-area-inset-bottom))}
  .topbar{padding:0 .85rem;gap:.5rem}
  .grid-2,.grid-3{grid-template-columns:1fr}
  .kpi-value{font-size:1.6rem}
  .toasts{left:1rem;right:1rem;max-width:none}
  .scrim{position:fixed;inset:0;z-index:65;background:rgba(6,11,22,.6)}
  /* Master stock becomes cards — no horizontal scrolling on the shop floor. */
  .stock-table{display:none}
  .stock-cards{display:flex;flex-direction:column;gap:.75rem}
  /* Give the search box the room instead of spelling out "shortages". */
  .pill-word{display:none}
}
</style>
</head>

<body>

<!-- =========================================================================
     BOOT GUARD
     ========================================================================= -->
<div id="boot" class="boot">
  <div class="spinner" style="border-top-color:var(--accent)"></div>
  <div id="boot-msg">Starting Eurolux Inventory…</div>
</div>
<script>
  // If the app has not booted within 12s the CDN scripts were almost certainly
  // blocked or unreachable. Say so rather than spinning forever.
  setTimeout(function () {
    var msg = document.getElementById("boot-msg");
    if (!msg) return;
    msg.innerHTML =
      '<div style="max-width:430px;text-align:center;line-height:1.55">' +
      "<strong>The app could not start.</strong><br>" +
      "The Alpine.js or Firebase scripts were blocked. Check your internet " +
      "connection and reload. On a corporate network, allow " +
      '<span style="font-family:monospace">cdn.jsdelivr.net</span> and ' +
      '<span style="font-family:monospace">www.gstatic.com</span>.</div>';
  }, 12000);
</script>

<div id="app" x-data="euroluxApp" x-init="initApp()" x-cloak style="display:none">

  <!-- ===================== CONFIG NOT SET ===================== -->
  <template x-if="configMissing">
    <div class="auth-screen">
      <div class="auth-card card card-pad stack">
        <h2 class="view-title">Firebase is not configured yet</h2>
        <p class="muted" style="font-size:.88rem">
          Open <span class="mono">firebase-config.js</span> in your repository and replace the
          placeholder values with the config object from your Firebase project
          (Project settings → General → Your apps → Web app → Config).
        </p>
        <div class="banner banner-info">Full setup steps are in <span class="mono">README.md</span>.</div>
      </div>
    </div>
  </template>

  <!-- ===================== SIGN IN ===================== -->
  <template x-if="!configMissing && !authUser && authReady">
    <div class="auth-screen">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="brand-mark" style="font-size:.85rem;padding:.7rem .8rem">EUROLUX</div>
          <div>
            <div style="font-weight:700;font-size:1.05rem">Inventory &amp; Stock Control</div>
            <div class="faint" style="font-size:.78rem">Aluminium profile operations</div>
          </div>
        </div>

        <div class="card card-pad stack">
          <template x-if="selfSignupEnabled">
            <div class="seg">
              <button :class="authMode==='signin' && 'on'"
                      @click="authMode='signin';authError='';authNotice=''">Sign in</button>
              <button :class="authMode==='signup' && 'on'"
                      @click="authMode='signup';authError='';authNotice=''">Create account</button>
            </div>
          </template>

          <form @submit.prevent="submitAuth()" class="stack">
            <div class="field" x-show="authMode==='signup'">
              <label class="label">Full name</label>
              <input class="input" type="text" x-model="authName" placeholder="e.g. Steve Mathew" autocomplete="name">
            </div>
            <div class="field">
              <label class="label">Work email</label>
              <input class="input" type="email" x-model="authEmail" required placeholder="you@eurolux.ae" autocomplete="username">
            </div>
            <div class="field">
              <label class="label">Password</label>
              <input class="input" type="password" x-model="authPassword" required minlength="6"
                     placeholder="At least 6 characters" :autocomplete="authMode==='signup'?'new-password':'current-password'">
            </div>

            <template x-if="authNotice">
              <div class="banner banner-info" x-text="authNotice"></div>
            </template>
            <template x-if="authError">
              <div class="banner banner-bad" x-text="authError"></div>
            </template>

            <button class="btn btn-primary btn-block" type="submit" :disabled="authBusy">
              <span x-show="authBusy" class="spinner"></span>
              <span x-text="authMode==='signin' ? 'Sign in' : 'Create account'"></span>
            </button>

            <button type="button" class="linkish" x-show="authMode==='signin'"
                    @click="resetPassword()" :disabled="authBusy">
              Forgot your password?
            </button>
          </form>

          <p class="hint" x-show="!selfSignupEnabled">
            Accounts are created by your administrator. If you do not have one yet,
            ask them to add you.
          </p>
          <p class="hint">
            Everyone who signs in shares the same live database. A receipt or issue
            posted on one device appears on every other device within a second.
          </p>
        </div>
      </div>
    </div>
  </template>

  <!-- ===================== MAIN APP ===================== -->
  <template x-if="!configMissing && authUser">
  <div class="shell">

    <div class="scrim" x-show="menuOpen" @click="menuOpen=false" x-cloak></div>
    <aside class="sidebar" :class="menuOpen && 'open'">
      <div>
        <div class="brand">
          <div class="brand-mark">EUROLUX</div>
          <div style="min-width:0">
            <div class="brand-name">Inventory Control</div>
            <div class="brand-sub">Stock &amp; BOM</div>
          </div>
        </div>

        <nav class="nav">
          <template x-for="t in tabs" :key="t.id">
            <button class="nav-item" :class="currentTab===t.id && 'active'" @click="go(t.id)">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round" x-html="t.icon"></svg>
              <span x-text="t.label"></span>
              <template x-if="t.id==='inventory' && shortageCount>0">
                <span class="nav-badge" x-text="shortageCount"></span>
              </template>
            </button>
          </template>
        </nav>
      </div>

      <div class="side-foot">
        <div class="row" style="justify-content:space-between;font-size:.74rem">
          <span class="muted">Saved on device</span>
          <span class="pill" :class="syncClass">
            <span class="dot"></span>
            <span x-text="syncLabel"></span>
          </span>
        </div>
        <div class="who">
          <div class="avatar" x-text="initials"></div>
          <div style="min-width:0">
            <div class="truncate" style="font-size:.8rem;font-weight:600" x-text="displayName"></div>
            <div class="truncate faint" style="font-size:.7rem" x-text="authUser?.email"></div>
          </div>
        </div>
        <button class="btn btn-sm btn-ghost" @click="doSignOut()">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="btn btn-sm btn-ghost menu-btn" @click="menuOpen=!menuOpen" aria-label="Menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        </button>

        <div class="search">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

                    <template x-for="item in shortageItems.slice(0,12)" :key="item.id">

              </div>

                <table>
                  <thead><tr>
                    <th>System reference</th><th class="right">Articles</th>

                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </template>

          <div class="card">
            <div class="card-pad" style="border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:1rem">
              <div>
                <h3 style="font-size:.95rem">Recent stock movements</h3>

                        <td><span class="pill" :class="moveClass(m.type)" x-text="m.type"></span></td>
                        <td class="mono" style="color:var(--accent)" x-text="m.article_ref"></td>

                    </template>
                  </tbody>
                </table>
              </div>
            </template>
          </div>
        </div>

        <!-- ============ INVENTORY ============ -->
        <div id="view-inventory" x-show="currentTab==='inventory'" class="stack">
          <div class="view-head">
            <div>
              <h2 class="view-title">Master Stock Control</h2>
              <p class="view-sub" x-text="`${filteredInventory.length} of ${inventory.length} profiles shown`"></p>
            </div>
            <div class="actions">
              <select class="select" style="width:auto;min-width:170px" x-model="selectedCategory">
                <option value="ALL SYSTEMS">ALL SYSTEMS</option>
                <template x-for="s in systems" :key="s">
                  <option :value="s" x-text="s"></option>
                </template>
              </select>
              <button class="btn btn-sm" @click="exportCsv()" :disabled="!inventory.length">Export CSV</button>
              <button class="btn btn-sm" @click="importOpen=true">Import CSV</button>
              <button class="btn btn-sm btn-primary" @click="openItem()">Add profile</button>
            </div>
          </div>

          <template x-if="!inventory.length">
            <div class="card empty">
              <div class="empty-title">Your stock list is empty</div>

              </div>

                <button class="btn btn-primary" @click="openItem()">Add first profile</button>

              </div>
            </div>

          <template x-if="inventory.length">
            <div class="stock-cards">

                      <div class="faint" style="font-size:.72rem;margin-top:.2rem"

                    </div>
                    <span class="pill" :class="statusClass(item)" x-text="statusLabel(item)"></span>
                  </div>

                  <div class="stock-figs">
                    <div>
                      <div class="stock-fig-label">Received</div>
                      <div class="stock-fig-value" style="color:var(--good)" x-text="fmt(item.received_qty)"></div>
                    </div>
                    <div>
                      <div class="stock-fig-label">Issued</div>
                      <div class="stock-fig-value" style="color:var(--violet)" x-text="fmt(item.issued_qty)"></div>
                    </div>
                    <div>
                      <div class="stock-fig-label">Balance</div>
                      <div class="stock-fig-value"

                    <button class="btn btn-sm btn-ghost" @click="openItem(item)">Edit</button>
                  </div>

              </template>

                  <th>Article</th>

                  <th class="right">Received</th>
                  <th class="right">Issued</th>
                  <th class="right">Balance</th>
                  <th>Status</th>
                  <th class="right"><span class="faint">Actions</span></th>
                </tr></thead>

                    <tr :class="isShort(item) && 'row-bad'">
                      <td class="muted" style="white-space:nowrap" x-text="item.system_ref || '—'"></td>
                      <td class="mono" style="color:var(--accent);font-weight:700" x-text="item.article_ref"></td>
                      <td>
                        <div x-text="item.description"></div>
                        <div class="faint" style="font-size:.72rem"
                             x-text="[item.location, item.unit].filter(Boolean).join(' · ')"></div>
                      </td>
                      <td class="right num" style="color:var(--good)" x-text="fmt(item.received_qty)"></td>
                      <td class="right num" style="color:var(--violet)" x-text="fmt(item.issued_qty)"></td>
                      <td class="right num"

                          x-text="fmt(balanceOf(item))"></td>
                      <td><span class="pill" :class="statusClass(item)" x-text="statusLabel(item)"></span></td>
                      <td>
                        <div class="cell-actions">

                </tfoot>
              </table>
            </div>
          </template>

                </tr></thead>

                </tbody>
              </table>
            </div>

              <button class="btn btn-sm btn-ghost" @click="ledgerShown = filteredMovements.length">Show all</button>
            </div>
          </template>
        </div>

        <div id="view-wizard" x-show="currentTab==='wizard'" class="stack">
          <div class="view-head">

              <h2 class="view-title">System BOM Wizard</h2>
              <p class="view-sub">Check a package bundle against live stock, then batch-book it to a villa project.</p>
            </div>
            <div class="actions">
              <button class="btn btn-sm btn-primary" @click="openBom()">New BOM template</button>
            </div>
          </div>

            <div class="card empty">
              <div class="empty-title">No BOM templates yet</div>
              <div style="margin-bottom:1rem;max-width:560px;margin-left:auto;margin-right:auto">
                A template lists the profiles consumed <strong>per unit</strong> of a system —
                ASE 36 pocket sliding door, AWS 65 window, ASE 54 PD, and so on.

                    <select class="select" x-model="wizard.bomId">
                      <option value="">— Choose system —</option>
                      <template x-for="b in boms" :key="b.id">

                  <div class="field">
                    <label class="label">2. Number of units</label>
                    <input class="input num" type="number" min="1" step="1" x-model.number="wizard.units">
                  </div>
                  <div class="field">
                    <label class="label">3. Target villa project</label>
                    <select class="select" x-model="wizard.projectId">
                      <option value="">— Select project destination —</option>
                      <template x-for="p in projects" :key="p.id">
                        <option :value="p.id" x-text="p.project_code"></option>
                      </template>
                    </select>
                  </div>
                </div>

                  <div class="row" style="margin-top:1rem;justify-content:space-between">

                      </button>
                    </div>
                  </div>

                <template x-if="selectedBom && !wizard.projectId">
                  <p class="hint" style="margin-top:.5rem;text-align:right">

                  <table>
                    <thead><tr>
                      <th>Article</th><th>Material Description</th>

                      <th class="right">On hand</th><th class="right">Short by</th><th>Status</th>
                    </tr></thead>

                      <template x-for="l in wizardLines" :key="l.article_ref">

                          <td class="right num muted" x-text="fmt(l.qty_per)"></td>

                  </table>
                </div>

                            <button class="btn btn-sm btn-danger" @click="removeBom(b)">Delete</button>
                          </div></td>
                        </tr>
                      </template>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </template>

<script type="module">
/* ===========================================================================
   Eurolux Inventory — application logic
   Firebase modular SDK v10 + Alpine.js 3

   Firestore data model
     inventory/{id}  system_ref, article_ref, description, unit, location,
                     min_qty, received_qty, issued_qty, balance_stock_qty
     movements/{id}  item_id, article_ref, description, system_ref, type,
                     qty, project_id, project_code, note, at, by, by_name
     projects/{id}   project_code, client, status, notes
     boms/{id}       name, system_ref, lines[{article_ref, description, qty_per}]
     settings/app    shortageThreshold
     users/{uid}     email, name, lastSeen

   balance_stock_qty is maintained atomically alongside received/issued so it can
   be read straight out of Firestore, but every figure shown in the UI is computed
   as received − issued. A drifted stored value therefore cannot mislead anyone.
   =========================================================================== */

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, signInWithEmailAndPassword,
  createUserWithEmailAndPassword, signOut, updateProfile, sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
  collection, doc, onSnapshot, query, orderBy, limit,
  addDoc, setDoc, updateDoc, deleteDoc, writeBatch,
  serverTimestamp, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
  firebaseConfig, allowedEmailDomain, collections, defaultShortageThreshold,
  allowSelfSignup, knownSystems
} from "./firebase-config.js";

// Accounts are created by an administrator in the Firebase console unless the
// config explicitly opts back in to self-registration.
const selfSignupEnabled = allowSelfSignup === true;

/* --- Config guard ------------------------------------------------------- */
const configMissing =
  !firebaseConfig ||
  !firebaseConfig.apiKey ||
  String(firebaseConfig.apiKey).startsWith("PASTE_") ||
  String(firebaseConfig.projectId || "").startsWith("PASTE_");

let auth = null, db = null;
if (!configMissing) {
  const fbApp = initializeApp(firebaseConfig);
  auth = getAuth(fbApp);
  try {
    db = initializeFirestore(fbApp, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }),
    });
  } catch (err) {
    console.warn("Firestore offline persistence unavailable:", err);
    db = initializeFirestore(fbApp, {});
  }
}

/* --- Helpers ------------------------------------------------------------ */
const nf = new Intl.NumberFormat("en-GB", { maximumFractionDigits: 2 });
const num = (v) => (Number.isFinite(Number(v)) ? Number(v) : 0);
const key = (v) => String(v ?? "").trim().toLowerCase();

function friendlyAuthError(code, fallback) {
  const map = {
    "auth/invalid-email": "That email address doesn't look right.",
    "auth/invalid-credential": "Email or password is incorrect.",
    "auth/wrong-password": "Email or password is incorrect.",
    "auth/user-not-found": "No account with that email. Use “Create account” first.",
    "auth/email-already-in-use": "An account with that email already exists — sign in instead.",
    "auth/weak-password": "Password must be at least 6 characters.",
    "auth/network-request-failed": "No network connection. Check your internet and try again.",
    "auth/too-many-requests": "Too many attempts. Wait a minute and try again.",
    "auth/unauthorized-domain":
      "This web address is not authorised in Firebase (Authentication → Settings → Authorised domains).",
    "auth/operation-not-allowed":
      "Email/password sign-in is not enabled in the Firebase console (Authentication → Sign-in method).",
    "auth/admin-restricted-operation":
      "New accounts are created by your administrator. Ask them to add you, then sign in here.",
  };
  return map[code] || fallback || "Sign-in failed. Please try again.";
}

/* Minimal RFC-4180-ish CSV parser (handles quotes and embedded commas). */
function parseCsv(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else if (c === '"') inQuotes = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
    else if (c !== "\r") field += c;
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows.filter((r) => r.some((c) => String(c).trim() !== ""));
}

function toCsv(rows) {
  return rows.map((r) =>
    r.map((cell) => {
      const s = cell === null || cell === undefined ? "" : String(cell);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }).join(",")
  ).join("\n");
}

function downloadCsv(rows, filename) {
  const blob = new Blob(["﻿" + toCsv(rows)], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

      return this.overrideName ||

    get initials() {
      return this.displayName.split(/[\s._-]+/).filter(Boolean).slice(0, 2)

    /* Systems that actually carry stock. Drives the stock filter, the KPI

    get systems() {
      return [...new Set(this.inventory.map((i) => i.system_ref).filter(Boolean))]
        .sort((a, b) => String(a).localeCompare(String(b)));
    },
    /* Everything offered when you TYPE a system reference: the systems above

    get systemOptions() {
      const out = [], seen = new Set();
      for (const s of [...(knownSystems || []), ...this.systems]) {
        const k = key(s);
        if (!s || seen.has(k)) continue;
        seen.add(k); out.push(s);

      return out.sort((a, b) => String(a).localeCompare(String(b)));

    get filteredInventory() {
      const q = key(this.searchQuery);
      let list = this.inventory;
      if (this.selectedCategory !== "ALL SYSTEMS") {
        list = list.filter((i) => i.system_ref === this.selectedCategory);

      if (q) {

          [i.article_ref, i.description, i.system_ref, i.location]
            .map((v) => String(v ?? "")).join(" ").toLowerCase().includes(q));
      }
      return [...list].sort((a, b) => {
        const s = String(a.system_ref || "").localeCompare(String(b.system_ref || ""));
        return s !== 0 ? s
          : String(a.article_ref).localeCompare(String(b.article_ref), undefined, { numeric: true });
      });
    },
    /* Every ledger row that matches the current filter — the real count. */
    get filteredMovements() {
      const q = key(this.searchQuery);
      return this.movements.filter((m) => {
        if (this.moveFilter && m.type !== this.moveFilter) return false;
        if (!q) return true;
        return [m.article_ref, m.description, m.project_code, m.note, m.by_name]
          .map((v) => String(v ?? "")).join(" ").toLowerCase().includes(q);
      });
    },
    /* What the ledger table actually draws. Thousands of rows in one table
       makes the page crawl on a phone, so show a page at a time and let the
       search box and the type filter do the narrowing. */
    get visibleMovements() { return this.filteredMovements.slice(0, this.ledgerShown); },

    /* The dropdown's options. Always includes whatever the record already
       carries, so editing an old BOM cannot silently blank its system. */
    systemChoices(current) {
      const list = this.systemOptions.slice();
      if (current && !list.some((s) => key(s) === key(current))) list.unshift(current);
      return list;
    },
    chooseSystem(value, which) {
      const isNew = value === "__new";
      if (which === "bom") {
        this.bomSystemNew = isNew;

      } else {
        this.itemSystemNew = isNew;
